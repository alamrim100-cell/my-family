<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة - العرض</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:Cairo,Tahoma,sans-serif;background:#f3eee4;color:#3b2a1a}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 18px;background:#6b4a2b;color:#fff}
header h1{margin:0;font-size:19px;font-weight:800}
.styles{display:flex;gap:8px;flex-wrap:wrap}
.styles button,header a{font:inherit;font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;transition:background .25s}
.styles button:hover,header a:hover{background:rgba(255,255,255,.3)}
.styles button.active{background:#fff;color:#6b4a2b}
iframe{flex:1;width:100%;border:0;display:block}
</style>
</head>
<body>
<header>
  <h1>شجرة العائلة</h1>
  <div class="styles" id="styles">
    <button data-file="family-style-1-branches.html">1 · الفروع النامية</button>
    <button data-file="family-style-2-heritage.html">2 · الوثيقة العريقة</button>
    <button data-file="family-style-3-zoom.html">3 · التكبير والتنقل</button>
    <button data-file="family-style-4-night.html">4 · الوضع الليلي</button>
  </div>
  <a href="family-tree.html">واجهة التعديل</a>
</header>
<iframe id="frame" title="شجرة العائلة"></iframe>

<script>
const KEY = 'family_view_style';
const buttons = [...document.querySelectorAll('#styles button')];
const frame = document.getElementById('frame');

function show(file){
  frame.src = file;
  buttons.forEach(b => b.classList.toggle('active', b.dataset.file === file));
  try { localStorage.setItem(KEY, file); } catch (e) {}
}

buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.file)));

let saved = null;
try { saved = localStorage.getItem(KEY); } catch (e) {}
const valid = buttons.map(b => b.dataset.file);
show(valid.includes(saved) ? saved : valid[0]);
</script>
</body>
</html>
