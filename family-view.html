<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Amiri,serif;color:#4a3420;overflow-x:hidden;
  background:radial-gradient(ellipse at center,#fbf4e2 0,#efe2c4 70%,#e2cfa4 100%)}
header{padding:16px 18px 6px;text-align:center}
header h1{margin:0 0 10px;font-size:34px;color:#7a5520;letter-spacing:1px}
.toolbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar button,.toolbar .tlink{font:inherit;font-size:17px;color:#6b4a2b;background:#fffaf0;border:1px solid #b08d4c;border-radius:999px;padding:6px 18px;cursor:pointer;text-decoration:none;transition:all .25s}
.toolbar button:hover:not(:disabled),.toolbar .tlink:hover{background:#f3e2b8}
.toolbar button:disabled{opacity:.4;cursor:default}
.crumbs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 0;font-size:16px;color:#8a6b3e}
.crumbs button{font:inherit;font-size:16px;color:#6b4a2b;background:transparent;border:0;cursor:pointer;padding:2px 6px;border-bottom:1px dashed #b08d4c}
.crumbs button:hover{color:#3b2a1a}
.crumbs .sep{color:#b08d4c}
main{padding:24px 14px 100px}
.roots{display:flex;flex-wrap:wrap;justify-content:center;gap:50px;animation:fade .5s both}
.empty{text-align:center;color:#8a6b3e;padding:50px 0;font-size:20px}

/* الشخص المفتوح والزوجان */
.focus{display:flex;justify-content:center;animation:up .5s both}
.couplehead{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;animation:up .5s both}
.bond{font-size:30px;color:#b08d4c;line-height:1}

/* خيارات الزوجات: بطاقات تظهر تحت الشخص */
.choicesRow{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:34px;padding-top:44px;animation:fade .5s both}
.choicesRow::before{content:'';position:absolute;top:0;left:50%;height:44px;border-left:1px dashed #b08d4c}

/* البطاقة */
.card{position:relative;overflow:hidden;width:215px;padding:18px 12px 14px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,247,230,.7));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;
  border:6px double #b08d4c;border-radius:50% 50% 16px 16px / 22% 22% 16px 16px;
  box-shadow:inset 0 0 0 2px #fffaf0,inset 0 0 0 3px #d9bf85,0 10px 22px rgba(90,60,20,.15);transition:transform .35s}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-5px)}
.card.big{width:270px;padding:22px 16px 16px}
.ring{width:124px;height:124px;margin:0 auto 10px;border-radius:50%;padding:5px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
.card.big .ring{width:156px;height:156px}
.ring img,.ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
.n{font-size:25px;font-weight:700;color:#5a3d1a;line-height:1.3}
.card.big .n{font-size:30px}
.meta{font-size:16px;color:#8a6b3e;margin-top:4px}
.cnt{margin-top:8px;font-size:16px;color:#7a5520;font-style:italic}
.dbtn{margin-top:10px;font:inherit;font-size:15px;color:#7a5520;background:transparent;border:1px solid #b08d4c;border-radius:999px;padding:2px 14px;cursor:pointer}
.dbtn:hover{background:#f3e2b8}
/* لمعة زجاجية تمر على البطاقة عند المرور بالمؤشر */
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .9s ease}
.card.clickable:hover::after{transform:translateX(120%)}
/* اسم متلألئ عند المرور */
.card.clickable:hover .n{background:linear-gradient(100deg,#5a3d1a 35%,#d4a94f 50%,#5a3d1a 65%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}

/* الأبناء وحدهم */
.kidsWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:44px;margin-top:6px;animation:fade .5s both}
.kidsWrap::before{content:'';position:absolute;top:0;left:50%;height:44px;border-left:1px dashed #b08d4c}
.pgroup{display:flex;flex-direction:column;align-items:center;gap:14px}
.glabel span{padding:2px 16px;border:1px solid #b08d4c;border-radius:999px;background:#fffaf0;font-size:17px;color:#7a5520}
.kidsRow{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}

/* لوحة التفاصيل */
#drawer{position:fixed;top:0;right:0;height:100%;width:360px;max-width:92vw;overflow:auto;padding:26px 22px;z-index:30;
  background:#fffaf0;border-left:6px double #b08d4c;box-shadow:-12px 0 30px rgba(60,35,10,.2);
  transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#drawer.open{transform:translateX(0)}
#closeDrawer{position:absolute;top:12px;left:12px;font:inherit;font-size:18px;background:transparent;border:1px solid #b08d4c;border-radius:50%;width:36px;height:36px;cursor:pointer;color:#7a5520}
#dbody{text-align:center;padding-top:20px}
#dbody .big{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;padding:6px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
#dbody .big img,#dbody .big .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
#dbody h2{margin:0 0 12px;font-size:28px;color:#5a3d1a}
#dbody .drow{font-size:19px;line-height:1.7;color:#5a4128;border-bottom:1px dotted #d9bf85;padding:6px 0}
#dbody .bio{font-size:18px;color:#6b5030;margin-top:12px;font-style:italic;line-height:1.8}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
</style>
</head>
<body>
<header>
  <h1>شجرة العائلة</h1>
  <div class="toolbar">
    <button id="backBtn" disabled>→ رجوع</button>
    <button id="homeBtn" disabled>الجيل الأول</button>
    <a href="family-tree.html" class="tlink">واجهة التعديل</a>
  </div>
  <div class="crumbs" id="crumbs"></div>
</header>
<main><div id="view"></div></main>

<aside id="drawer">
  <button id="closeDrawer" title="إغلاق">✕</button>
  <div id="dbody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://nrddblppxdiklixjxsni.supabase.co','sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT');
let people=[], marriages=[];
// مسار التنقل: {id} لشخص، أو {id, pid} لزوجين محددين
let stack=[];
const $=id=>document.getElementById(id);
const byId=id=>people.find(p=>p.id===id);
const nameOf=id=>(byId(id)||{}).name||'';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const dispName=p=>(p.death?'المرحوم ':'')+p.name;
const lifeText=p=>p.death?'الحياة: '+(p.birth||'؟')+' – '+p.death:(p.birth?'الميلاد: '+p.birth:'');

async function load(){
  const [p,m]=await Promise.all([sb.from('people').select('*').order('created_at'),sb.from('marriages').select('*')]);
  if(p.error){ $('view').innerHTML='<div class="empty">تعذر تحميل الشجرة، حاول لاحقاً</div>'; return; }
  people=(p.data||[]).map(r=>({id:r.id,name:r.name,birth:r.birth||'',death:r.death||'',gender:r.gender||'',fatherId:r.father_id||'',motherId:r.mother_id||'',spouseId:r.spouse_id||'',bio:r.bio||'',photo:r.photo_url||'',outsider:!!r.is_outsider}));
  marriages=(m.data||[]).map(x=>({h:x.husband_id,w:x.wife_id,pos:x.position||0}));
  render();
}
function partnersOf(id){
  const list=marriages.filter(m=>m.h===id||m.w===id).sort((a,b)=>a.pos-b.pos).map(m=>m.h===id?m.w:m.h);
  const me=byId(id); if(me&&me.spouseId&&byId(me.spouseId)&&!list.includes(me.spouseId))list.push(me.spouseId);
  people.forEach(p=>{if(p.spouseId===id&&!list.includes(p.id))list.push(p.id);});
  return [...new Set(list)].filter(x=>byId(x));
}
function primaryParent(c){const f=byId(c.fatherId),m=byId(c.motherId);if(f&&!f.outsider)return f.id;if(m&&!m.outsider)return m.id;if(f)return f.id;if(m)return m.id;return null;}
function kidsOfPair(id,pid){
  return people.filter(c=>!c.outsider && ((c.fatherId===id&&c.motherId===pid)||(c.fatherId===pid&&c.motherId===id)) && primaryParent(c)===id);
}
function childrenGroups(id){
  const partners=partnersOf(id), map=new Map(); partners.forEach(p=>map.set(p,[])); map.set(null,[]);
  people.forEach(c=>{if(c.outsider)return;if(c.fatherId!==id&&c.motherId!==id)return;if(primaryParent(c)!==id)return;const o=c.fatherId===id?c.motherId:c.fatherId;map.get(partners.includes(o)?o:null).push(c);});
  const out=[]; partners.forEach(p=>{const k=map.get(p);if(k.length)out.push({label:'مع '+nameOf(p),kids:k});});
  if(map.get(null).length)out.push({label:partners.length?'من غير الزوج/الزوجة المسجّل':'',kids:map.get(null)});
  return out;
}
const countKids=id=>childrenGroups(id).reduce((s,g)=>s+g.kids.length,0);
const rootsList=()=>people.filter(p=>!p.fatherId&&!p.motherId&&!p.outsider&&!(p.gender==='female'&&partnersOf(p.id).length));

// ===== التنقل =====
function open(id){ stack.push({id}); render(); }
function openPair(id,pid){ stack.push({id,pid}); render(); }
function back(){ stack.pop(); render(); }
function jump(i){ stack=stack.slice(0,i+1); render(); }
function home(){ stack=[]; render(); }

// ===== بطاقة شخص =====
function nodeCard(p,o){
  const c=el('div','card'+(o.big?' big':'')+(o.onClick?' clickable':''));
  const r=el('div','ring');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';r.appendChild(i);} else r.appendChild(el('div','ph'));
  c.appendChild(r);
  c.appendChild(el('div','n',dispName(p)));
  const life=lifeText(p); if(life)c.appendChild(el('div','meta',life));
  const n=o.count!==undefined?o.count:countKids(p.id);
  if(n) c.appendChild(el('div','cnt',n+' '+(n===1?'ابن':'أبناء')));
  const d=el('button','dbtn','التفاصيل');
  d.onclick=ev=>{ev.stopPropagation();openDrawer(p.id);};
  c.appendChild(d);
  if(o.onClick) c.onclick=o.onClick;
  return c;
}

function kidsSection(kids){
  if(!kids.length) return el('div','empty','لا يوجد أبناء مسجّلون');
  const wrap=el('div','kidsWrap');
  const row=el('div','kidsRow');
  kids.forEach(k=>row.appendChild(nodeCard(k,{onClick:()=>open(k.id)})));
  wrap.appendChild(row);
  return wrap;
}

function render(){
  // شريط المسار
  const cr=$('crumbs'); cr.innerHTML='';
  if(stack.length){
    const h=el('button','','الجيل الأول'); h.onclick=home; cr.appendChild(h);
    stack.forEach((e,i)=>{
      cr.appendChild(el('span','sep','‹'));
      const label=e.pid?nameOf(e.id)+' و'+nameOf(e.pid):nameOf(e.id);
      const b=el('button','',label); b.onclick=()=>jump(i); cr.appendChild(b);
    });
  }
  $('backBtn').disabled=!stack.length;
  $('homeBtn').disabled=!stack.length;

  const v=$('view'); v.innerHTML='';

  // الجيل الأول
  if(!stack.length){
    const roots=rootsList();
    if(!roots.length){ v.innerHTML='<div class="empty">لا توجد بيانات بعد.</div>'; return; }
    const row=el('div','roots');
    roots.forEach(r=>row.appendChild(nodeCard(r,{onClick:()=>open(r.id)})));
    v.appendChild(row);
    return;
  }

  const top=stack[stack.length-1];
  const cur=top.id;
  const partners=partnersOf(cur);

  // زوجان محددان: الاثنان بالأعلى، وأبناؤهما تحتهما
  if(top.pid){
    const head=el('div','couplehead');
    head.appendChild(nodeCard(byId(cur),{big:true,count:kidsOfPair(cur,top.pid).length}));
    head.appendChild(el('div','bond','⚭'));
    head.appendChild(nodeCard(byId(top.pid),{big:true,count:kidsOfPair(cur,top.pid).length}));
    v.appendChild(head);
    v.appendChild(kidsSection(kidsOfPair(cur,top.pid)));
    return;
  }

  // أكثر من زوج/زوجة: تظهر بطاقاتهم تحت الشخص لاختيار أحدهم
  if(partners.length>=2){
    v.appendChild(el('div','focus'));
    v.lastChild.appendChild(nodeCard(byId(cur),{big:true}));
    const row=el('div','choicesRow');
    partners.forEach(pid=>{
      row.appendChild(nodeCard(byId(pid),{count:kidsOfPair(cur,pid).length,onClick:()=>openPair(cur,pid)}));
    });
    v.appendChild(row);
    return;
  }

  // زوج/زوجة واحدة أو بلا زوج: الأبناء مباشرة
  v.appendChild(el('div','focus'));
  v.lastChild.appendChild(nodeCard(byId(cur),{big:true}));
  const groups=childrenGroups(cur);
  if(!groups.length){ v.appendChild(el('div','empty','لا يوجد أبناء مسجّلون لهذا الشخص')); return; }
  const wrap=el('div','kidsWrap');
  groups.forEach(g=>{
    const pg=el('div','pgroup');
    if(groups.length>1&&g.label){ const lb=el('div','glabel'); lb.appendChild(el('span','',g.label)); pg.appendChild(lb); }
    const row=el('div','kidsRow');
    g.kids.forEach(k=>row.appendChild(nodeCard(k,{onClick:()=>open(k.id)})));
    pg.appendChild(row);
    wrap.appendChild(pg);
  });
  v.appendChild(wrap);
}

// ===== لوحة التفاصيل =====
function openDrawer(id){
  const p=byId(id); if(!p) return;
  const b=$('dbody'); b.innerHTML='';
  const big=el('div','big');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';big.appendChild(i);} else big.appendChild(el('div','ph'));
  b.append(big, el('h2','',dispName(p)));
  const rows=[];
  if(p.gender) rows.push('الجنس: '+(p.gender==='male'?'ذكر':'أنثى'));
  if(p.death) rows.push('فترة الحياة: من '+(p.birth||'؟')+' إلى '+p.death);
  else if(p.birth) rows.push('تاريخ الميلاد: '+p.birth);
  if(p.fatherId) rows.push('الأب: '+nameOf(p.fatherId));
  if(p.motherId) rows.push('الأم: '+nameOf(p.motherId));
  const pts=partnersOf(id); if(pts.length) rows.push('الزوج / الزوجة: '+pts.map(nameOf).join('، '));
  rows.push('عدد الأبناء: '+countKids(id));
  rows.forEach(t=>b.appendChild(el('div','drow',t)));
  if(p.bio) b.appendChild(el('div','bio',p.bio));
  $('drawer').classList.add('open');
}
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');

$('backBtn').onclick=back;
$('homeBtn').onclick=home;
load();
</script>
</body>
</html>
