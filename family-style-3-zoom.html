<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاتجاه 3: التكبير والتنقل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;color:#3b2a1a;
  background:linear-gradient(160deg,#fbf6ec,#efe4cf)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 20px;background:rgba(138,90,43,.92);color:#fff}
header h1{margin:0;font-size:20px}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.crumbs button{font:inherit;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
.crumbs button:hover{background:rgba(255,255,255,.35)}
main{padding:30px 16px 80px;min-height:80vh}
/* الجذور */
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;animation:in .6s both}
.tile{width:200px;padding:16px 12px;background:#fff;border-radius:22px;text-align:center;cursor:pointer;box-shadow:0 8px 22px rgba(80,50,20,.12);transition:transform .35s,box-shadow .35s}
.tile:hover{transform:scale(1.05);box-shadow:0 16px 36px rgba(80,50,20,.2)}
/* صفحة التكبير */
.focus{max-width:1000px;margin:0 auto;animation:zoom .55s cubic-bezier(.2,.8,.2,1) both}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px}
.big-ring{width:150px;height:150px;border-radius:50%;padding:6px;background:conic-gradient(#8a5a2b,#f3d9a8,#8a5a2b,#f3d9a8,#8a5a2b);box-shadow:0 14px 30px rgba(80,50,20,.25);animation:float 4s ease-in-out infinite}
.big-ring img,.big-ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee}
.hero h2{margin:14px 0 4px;font-size:30px}
.hero .info{color:#7a6146;font-size:15px;line-height:1.7}
.hero .sp{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;background:#f3e6cf;color:#6b4a2b;font-size:14px}
.kids-title{text-align:center;margin:28px 0 14px;color:#8a5a2b;font-weight:800;font-size:18px}
.kids-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.kid{width:170px;padding:14px 10px;background:#fff;border-radius:18px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(80,50,20,.1);transition:transform .3s;animation:pop .5s both}
.kid:hover{transform:translateY(-6px)}
.kid .ring{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;padding:3px;background:#e8c98f}
.kid .ring img,.kid .ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee}
.kid .n{font-weight:800;font-size:15px}
.kid .c{font-size:12px;color:#8a5a2b;margin-top:6px}
.none{color:#8a7055;text-align:center;margin-top:12px}
.tile .ring,.hero .ring{margin:0 auto 8px}
.tile .ring{width:84px;height:84px;border-radius:50%;padding:3px;background:#e8c98f}
.tile .ring img,.tile .ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee}
.tile .n{font-weight:800}
.tile .c{font-size:12px;color:#8a5a2b;margin-top:6px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</head>
<body>
<header>
  <h1>شجرة العائلة</h1>
  <div class="crumbs" id="crumbs"></div>
</header>
<main><div id="view"></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://nrddblppxdiklixjxsni.supabase.co','sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT');
let people=[], marriages=[];
let stack=[];
const $=id=>document.getElementById(id);
const byId=id=>people.find(p=>p.id===id);
const nameOf=id=>(byId(id)||{}).name||'';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};

async function load(){
  const [p,m]=await Promise.all([sb.from('people').select('*').order('created_at'),sb.from('marriages').select('*')]);
  people=(p.data||[]).map(r=>({id:r.id,name:r.name,birth:r.birth||'',death:r.death||'',gender:r.gender||'',fatherId:r.father_id||'',motherId:r.mother_id||'',spouseId:r.spouse_id||'',photo:r.photo_url||'',outsider:!!r.is_outsider}));
  marriages=(m.data||[]).map(x=>({h:x.husband_id,w:x.wife_id,pos:x.position||0}));
  render();
}
function partnersOf(id){
  const list=marriages.filter(m=>m.h===id||m.w===id).sort((a,b)=>a.pos-b.pos).map(m=>m.h===id?m.w:m.h);
  const me=byId(id); if(me&&me.spouseId&&byId(me.spouseId)&&!list.includes(me.spouseId))list.push(me.spouseId);
  people.forEach(p=>{if(p.spouseId===id&&!list.includes(p.id))list.push(p.id);});
  return [...new Set(list)].filter(x=>byId(x));
}
function primaryParent(c){const f=byId(c.fatherId),m=byId(c.motherId);if(f&&!f.outsider)return f.id;if(m&&!m.outsider)return m.id;if(f)return f.id;if(m)return m.id;return null;}
function kidsOf(id){
  const partners=partnersOf(id); const out=[];
  people.forEach(c=>{if(c.outsider)return;if(c.fatherId!==id&&c.motherId!==id)return;if(primaryParent(c)!==id)return;out.push(c);});
  return out;
}
const rootsList=()=>people.filter(p=>!p.fatherId&&!p.motherId&&!p.outsider&&!(p.gender==='female'&&partnersOf(p.id).length));
const lifeText=p=>p.death?'الحياة: '+(p.birth||'؟')+' – '+p.death:(p.birth?'الميلاد: '+p.birth:'');
function ringWith(p,cls){
  const r=el('div',cls);
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';r.appendChild(i);} else r.appendChild(el('div','ph'));
  return r;
}

function go(id){ stack.push(id); render(); }
function back(i){ stack=stack.slice(0,i); render(); }

function render(){
  const crumbs=$('crumbs'); crumbs.innerHTML='';
  const home=el('button','',"الجذور"); home.onclick=()=>back(0); crumbs.appendChild(home);
  stack.forEach((id,i)=>{const b=el('button','',nameOf(id)); b.onclick=()=>back(i+1); crumbs.appendChild(b);});

  const view=$('view'); view.innerHTML='';
  if(!stack.length){
    const g=el('div','grid');
    rootsList().forEach(p=>{
      const t=el('div','tile'); t.appendChild(ringWith(p,'ring')); t.append(el('div','n',p.name));
      const n=kidsOf(p.id).length; if(n) t.appendChild(el('div','c',n+' '+(n===1?'ابن/ابنة':'أبناء')));
      t.onclick=()=>go(p.id); g.appendChild(t);
    });
    view.appendChild(g); return;
  }

  const id=stack[stack.length-1], p=byId(id);
  const f=el('div','focus');
  const hero=el('div','hero');
  hero.appendChild(ringWith(p,'big-ring'));
  hero.appendChild(el('h2','',p.name));
  const info=el('div','info',lifeText(p)); hero.appendChild(info);
  const pts=partnersOf(id);
  if(pts.length) hero.appendChild(el('div','sp','الزوج / الزوجة: '+pts.map(nameOf).join('، ')));
  f.appendChild(hero);

  const kids=kidsOf(id);
  if(kids.length){
    f.appendChild(el('div','kids-title',kids.length===1?'ابن/ابنة':'الأبناء'));
    const kg=el('div','kids-grid');
    kids.forEach((k,i)=>{
      const c=el('div','kid'); c.style.animationDelay=(i*80)+'ms';
      c.appendChild(ringWith(k,'ring')); c.append(el('div','n',k.name));
      const nk=kidsOf(k.id).length; c.appendChild(el('div','c',nk?('عرض '+nk+' '+(nk===1?'ابن/ابنة':'أبناء')):lifeText(k)||'—'));
      c.onclick=()=>go(k.id); kg.appendChild(c);
    });
    f.appendChild(kg);
  } else {
    f.appendChild(el('div','none','لا يوجد أبناء مسجّلون لهذا الشخص'));
  }
  view.appendChild(f);
}

load();
</script>
</body>
</html>
