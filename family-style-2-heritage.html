<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الوثيقة العريقة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Amiri,serif;color:#4a3420;overflow-x:hidden;
  background:radial-gradient(ellipse at center,#fbf4e2 0,#efe2c4 70%,#e2cfa4 100%)}
header{text-align:center;padding:22px 16px 4px}
header h1{margin:0;font-size:36px;color:#7a5520;letter-spacing:1px}
header .orn{color:#b08d4c;font-size:20px;letter-spacing:10px}
.toolbar{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.toolbar button{font:inherit;font-size:17px;color:#6b4a2b;background:#fffaf0;border:1px solid #b08d4c;border-radius:999px;padding:6px 18px;cursor:pointer;transition:all .25s}
.toolbar button:hover:not(:disabled){background:#f3e2b8}
.toolbar button:disabled{opacity:.45;cursor:default}
.toolbar .tlink{font:inherit;font-size:17px;color:#6b4a2b;background:#fffaf0;border:1px solid #b08d4c;border-radius:999px;padding:6px 18px;text-decoration:none;transition:all .25s}
.toolbar .tlink:hover{background:#f3e2b8}
main{padding:20px 14px 100px}
.roots{display:flex;flex-wrap:wrap;justify-content:center;gap:60px}
.empty{text-align:center;color:#8a6b3e;padding:50px 0;font-size:20px}

/* الوحدة: الزوجان ثم الأبناء تحتهما */
.unit{position:relative;display:flex;flex-direction:column;align-items:center}
.unit.anim{animation:up .7s both}
.unit.child::before{content:'';position:absolute;top:-30px;left:50%;height:30px;border-left:1px dashed #b08d4c}
.couple{display:flex;align-items:flex-start;gap:14px}
.bond{align-self:center;font-size:28px;color:#b08d4c;line-height:1}

/* البطاقة: إطار مزدوج كالميدالية */
.card{position:relative;width:215px;padding:18px 12px 14px;background:#fffaf0;text-align:center;cursor:pointer;
  border:6px double #b08d4c;border-radius:50% 50% 16px 16px / 24% 24% 16px 16px;
  box-shadow:inset 0 0 0 2px #fffaf0,inset 0 0 0 3px #d9bf85,0 10px 22px rgba(90,60,20,.15);transition:transform .35s,background .35s}
.card:hover{transform:translateY(-4px)}
.card.static{cursor:default}
.card.static:hover{transform:none}
.card.open{background:#fff3d6}
.card.partner{background:#fbf3df}
.ring{width:124px;height:124px;margin:0 auto 10px;border-radius:50%;padding:5px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
.ring img,.ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
.n{font-size:25px;font-weight:700;color:#5a3d1a;line-height:1.3}
.meta{font-size:16px;color:#8a6b3e;margin-top:4px}
.cnt{margin-top:8px;font-size:16px;color:#7a5520;font-style:italic}
.dbtn{margin-top:10px;font:inherit;font-size:15px;color:#7a5520;background:transparent;border:1px solid #b08d4c;border-radius:999px;padding:2px 14px;cursor:pointer}
.dbtn:hover{background:#f3e2b8}

/* الأبناء */
.kids{position:relative;margin-top:34px;padding-top:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:34px;animation:fade .6s both}
.kids::before{content:'';position:absolute;top:0;left:50%;height:34px;border-left:1px dashed #b08d4c}
.group{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:26px}
.group::before{content:'';position:absolute;top:0;left:12%;right:12%;border-top:1px dashed #b08d4c}
.group.labeled::before{display:none}
.glabel{width:100%;text-align:center;margin-bottom:14px;font-size:17px;color:#7a5520}
.glabel span{padding:2px 16px;border:1px solid #b08d4c;border-radius:999px;background:#fffaf0}

/* لوحة التفاصيل الجانبية */
#drawer{position:fixed;top:0;right:0;height:100%;width:360px;max-width:92vw;overflow:auto;padding:26px 22px;z-index:30;
  background:#fffaf0;border-left:6px double #b08d4c;box-shadow:-12px 0 30px rgba(60,35,10,.2);
  transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#drawer.open{transform:translateX(0)}
#closeDrawer{position:absolute;top:12px;left:12px;font:inherit;font-size:18px;background:transparent;border:1px solid #b08d4c;border-radius:50%;width:36px;height:36px;cursor:pointer;color:#7a5520}
#dbody{text-align:center;padding-top:20px}
#dbody .big{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;padding:6px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
#dbody .big img,#dbody .big .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
#dbody h2{margin:0 0 12px;font-size:28px;color:#5a3d1a}
#dbody .drow{font-size:19px;line-height:1.7;color:#5a4128;border-bottom:1px dotted #d9bf85;padding:6px 0}
#dbody .bio{font-size:18px;color:#6b5030;margin-top:12px;font-style:italic;line-height:1.8}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<header>
  <div class="orn">❖ ❖ ❖</div>
  <h1>شجرة العائلة</h1>
  <div class="toolbar">
    <button id="undoBtn" disabled>↩ تراجع</button>
    <button id="collapseAll">طيّ الكل</button>
    <a href="family-tree.html" class="tlink">واجهة التعديل</a>
  </div>
</header>
<main><div id="tree"></div></main>

<aside id="drawer">
  <button id="closeDrawer" title="إغلاق">✕</button>
  <div id="dbody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://nrddblppxdiklixjxsni.supabase.co','sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT');
let people=[], marriages=[];
let expandedSet=new Set();
let undoStack=[];
let prevVisible=new Set(), visible=new Set();
const $=id=>document.getElementById(id);
const byId=id=>people.find(p=>p.id===id);
const nameOf=id=>(byId(id)||{}).name||'';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const dispName=p=>(p.death?'المرحوم ':'')+p.name;
const lifeText=p=>p.death?'الحياة: '+(p.birth||'؟')+' – '+p.death:(p.birth?'الميلاد: '+p.birth:'');

async function load(){
  const [p,m]=await Promise.all([sb.from('people').select('*').order('created_at'),sb.from('marriages').select('*')]);
  if(p.error){ $('tree').innerHTML='<div class="empty">تعذر تحميل الشجرة، حاول لاحقاً</div>'; return; }
  people=(p.data||[]).map(r=>({id:r.id,name:r.name,birth:r.birth||'',death:r.death||'',gender:r.gender||'',fatherId:r.father_id||'',motherId:r.mother_id||'',spouseId:r.spouse_id||'',bio:r.bio||'',photo:r.photo_url||'',outsider:!!r.is_outsider}));
  marriages=(m.data||[]).map(x=>({h:x.husband_id,w:x.wife_id,pos:x.position||0}));
  render();
}
function partnersOf(id){
  const list=marriages.filter(m=>m.h===id||m.w===id).sort((a,b)=>a.pos-b.pos).map(m=>m.h===id?m.w:m.h);
  const me=byId(id); if(me&&me.spouseId&&byId(me.spouseId)&&!list.includes(me.spouseId))list.push(me.spouseId);
  people.forEach(p=>{if(p.spouseId===id&&!list.includes(p.id))list.push(p.id);});
  return [...new Set(list)].filter(x=>byId(x));
}
function primaryParent(c){const f=byId(c.fatherId),m=byId(c.motherId);if(f&&!f.outsider)return f.id;if(m&&!m.outsider)return m.id;if(f)return f.id;if(m)return m.id;return null;}
function childrenGroups(id){
  const partners=partnersOf(id), map=new Map(); partners.forEach(p=>map.set(p,[])); map.set(null,[]);
  people.forEach(c=>{if(c.outsider)return;if(c.fatherId!==id&&c.motherId!==id)return;if(primaryParent(c)!==id)return;const o=c.fatherId===id?c.motherId:c.fatherId;map.get(partners.includes(o)?o:null).push(c);});
  const out=[]; partners.forEach(p=>{const k=map.get(p);if(k.length)out.push({label:'مع '+nameOf(p),kids:k});}); if(map.get(null).length)out.push({label:partners.length?'من غير الزوج/الزوجة المسجّل':'',kids:map.get(null)});
  return out;
}
const countKids=id=>childrenGroups(id).reduce((s,g)=>s+g.kids.length,0);
const rootsList=()=>people.filter(p=>!p.fatherId&&!p.motherId&&!p.outsider&&!(p.gender==='female'&&partnersOf(p.id).length));
function pathToRoot(id){
  const path=[]; let cur=id; const seen=new Set();
  while(cur&&!seen.has(cur)){ seen.add(cur); const p=byId(cur); if(!p) break; const par=primaryParent(p); if(!par) break; path.push(par); cur=par; }
  return path;
}

// ===== التنقل: فتح فرع يطوي ما سواه، والتراجع يعيد الحالة السابقة =====
function go(next){ undoStack.push(new Set(expandedSet)); expandedSet=next; render(); }
function clickCard(id){
  if(expandedSet.has(id)){ const n=new Set(expandedSet); n.delete(id); go(n); }
  else { const n=new Set(pathToRoot(id)); n.add(id); go(n); }
}
function undo(){ if(!undoStack.length) return; expandedSet=undoStack.pop(); render(); }
function collapseAll(){ go(new Set()); }

// ===== بطاقة =====
function makeCard(p,o){
  const c=el('div','card'+(o.open?' open':'')+(o.clickable?'':' static')+(o.partner?' partner':''));
  const r=el('div','ring');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';r.appendChild(i);} else r.appendChild(el('div','ph'));
  c.appendChild(r);
  c.appendChild(el('div','n',dispName(p)));
  const life=lifeText(p); if(life)c.appendChild(el('div','meta',life));
  if(o.count)c.appendChild(el('div','cnt',(o.open?'طيّ ':'عرض ')+o.count+' '+(o.count===1?'ابن':'أبناء')));
  const d=el('button','dbtn','التفاصيل');
  d.onclick=ev=>{ev.stopPropagation();openDrawer(p.id);};
  c.appendChild(d);
  return c;
}

// ===== الوحدة: الشخص مع زوجه/زوجاته، ثم أبناؤه عند فتحه =====
function unitFor(id,depth,isChild,index){
  visible.add(id);
  const p=byId(id);
  const box=el('div','unit'+(isChild?' child':''));
  if(!prevVisible.has(id)){ box.classList.add('anim'); box.style.animationDelay=(index*90)+'ms'; }
  const open=expandedSet.has(id);
  const row=el('div','couple');
  const main=makeCard(p,{open,count:countKids(id),clickable:true});
  main.onclick=()=>clickCard(id);
  row.appendChild(main);
  partnersOf(id).forEach(pid=>{
    row.appendChild(el('div','bond','⚭'));
    row.appendChild(makeCard(byId(pid),{open:false,count:0,clickable:false,partner:true}));
  });
  box.appendChild(row);
  if(open) box.appendChild(kidsEl(id,depth));
  return box;
}
function kidsEl(id,depth){
  const groups=childrenGroups(id);
  const h=el('div','kids');
  let k=0;
  groups.forEach(g=>{
    const gr=el('div','group'+(groups.length>1&&g.label?' labeled':''));
    if(groups.length>1&&g.label){ const lb=el('div','glabel'); lb.appendChild(el('span','',g.label)); gr.appendChild(lb); }
    g.kids.forEach(child=>{ gr.appendChild(unitFor(child.id,depth+1,true,k)); k++; });
    h.appendChild(gr);
  });
  return h;
}

function render(){
  visible=new Set();
  const t=$('tree'); t.innerHTML='';
  const roots=rootsList();
  if(!roots.length){ t.innerHTML='<div class="empty">لا توجد بيانات بعد.</div>'; }
  else {
    const wrap=el('div','roots');
    roots.forEach((r,i)=>wrap.appendChild(unitFor(r.id,0,false,i)));
    t.appendChild(wrap);
  }
  prevVisible=new Set(visible);
  $('undoBtn').disabled=!undoStack.length;
}

// ===== لوحة التفاصيل =====
function openDrawer(id){
  const p=byId(id); if(!p) return;
  const b=$('dbody'); b.innerHTML='';
  const big=el('div','big');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';big.appendChild(i);} else big.appendChild(el('div','ph'));
  b.append(big, el('h2','',dispName(p)));
  const rows=[];
  if(p.gender) rows.push('الجنس: '+(p.gender==='male'?'ذكر':'أنثى'));
  if(p.death) rows.push('فترة الحياة: من '+(p.birth||'؟')+' إلى '+p.death);
  else if(p.birth) rows.push('تاريخ الميلاد: '+p.birth);
  if(p.fatherId) rows.push('الأب: '+nameOf(p.fatherId));
  if(p.motherId) rows.push('الأم: '+nameOf(p.motherId));
  const pts=partnersOf(id); if(pts.length) rows.push('الزوج / الزوجة: '+pts.map(nameOf).join('، '));
  const n=countKids(id); rows.push('عدد الأبناء: '+n);
  rows.forEach(t=>b.appendChild(el('div','drow',t)));
  if(p.bio) b.appendChild(el('div','bio',p.bio));
  $('drawer').classList.add('open');
}
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');

$('undoBtn').onclick=undo;
$('collapseAll').onclick=collapseAll;
load();
</script>
</body>
</html>
