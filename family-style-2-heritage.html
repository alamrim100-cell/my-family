<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاتجاه 2: الوثيقة العريقة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;font-family:Amiri,serif;color:#4a3420;
  background:radial-gradient(ellipse at center,#fbf4e2 0,#efe2c4 70%,#e2cfa4 100%)}
header{text-align:center;padding:26px 16px 6px}
header h1{margin:0;font-size:38px;color:#7a5520;letter-spacing:1px}
header .orn{color:#b08d4c;font-size:22px;letter-spacing:10px}
header p{margin:6px 0 0;color:#8a6b3e}
main{padding:20px 14px 90px}
.roots{display:flex;flex-wrap:wrap;justify-content:center;gap:54px}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;animation:up .7s both}
.unit.child::before{content:'';position:absolute;top:-30px;left:50%;height:30px;border-left:1px dashed #b08d4c;animation:grow .5s both}
.card{width:200px;padding:16px 12px 14px;background:#fffaf0;cursor:pointer;text-align:center;
  border:6px double #b08d4c;border-radius:50% 50% 16px 16px / 26% 26% 16px 16px;
  box-shadow:inset 0 0 0 2px #fffaf0,inset 0 0 0 3px #d9bf85,0 10px 22px rgba(90,60,20,.15);transition:transform .35s}
.card:hover{transform:translateY(-4px)}
.card.open{background:#fff3d6}
.ring{width:90px;height:90px;margin:0 auto 8px;border-radius:50%;padding:4px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
.ring img,.ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
.n{font-size:23px;font-weight:700;color:#5a3d1a}
.meta,.sp{font-size:15px;color:#8a6b3e;margin-top:3px}
.cnt{margin-top:8px;font-size:15px;color:#7a5520;font-style:italic}
.kids{position:relative;margin-top:30px;padding-top:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:30px;animation:fade .6s both}
.kids::before{content:'';position:absolute;top:0;left:50%;height:30px;border-left:1px dashed #b08d4c;animation:grow .5s both}
.group{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.group::before{content:'';position:absolute;top:0;left:12%;right:12%;border-top:1px dashed #b08d4c;animation:grow .6s .2s both;transform-origin:center}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>
<body>
<header>
  <div class="orn">❖ ❖ ❖</div>
  <h1>شجرة العائلة</h1>
  <p>سجل الأنساب · اضغط على الاسم لتتفتح فروعه</p>
</header>
<main><div id="tree"></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://nrddblppxdiklixjxsni.supabase.co','sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT');
let people=[], marriages=[];
const expandedSet=new Set();
const $=id=>document.getElementById(id);
const byId=id=>people.find(p=>p.id===id);
const nameOf=id=>(byId(id)||{}).name||'';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};

async function load(){
  const [p,m]=await Promise.all([sb.from('people').select('*').order('created_at'),sb.from('marriages').select('*')]);
  people=(p.data||[]).map(r=>({id:r.id,name:r.name,birth:r.birth||'',death:r.death||'',gender:r.gender||'',fatherId:r.father_id||'',motherId:r.mother_id||'',spouseId:r.spouse_id||'',photo:r.photo_url||'',outsider:!!r.is_outsider}));
  marriages=(m.data||[]).map(x=>({h:x.husband_id,w:x.wife_id,pos:x.position||0}));
  start();
}
function partnersOf(id){
  const list=marriages.filter(m=>m.h===id||m.w===id).sort((a,b)=>a.pos-b.pos).map(m=>m.h===id?m.w:m.h);
  const me=byId(id); if(me&&me.spouseId&&byId(me.spouseId)&&!list.includes(me.spouseId))list.push(me.spouseId);
  people.forEach(p=>{if(p.spouseId===id&&!list.includes(p.id))list.push(p.id);});
  return [...new Set(list)].filter(x=>byId(x));
}
function primaryParent(c){const f=byId(c.fatherId),m=byId(c.motherId);if(f&&!f.outsider)return f.id;if(m&&!m.outsider)return m.id;if(f)return f.id;if(m)return m.id;return null;}
function childrenGroups(id){
  const partners=partnersOf(id), map=new Map(); partners.forEach(p=>map.set(p,[])); map.set(null,[]);
  people.forEach(c=>{if(c.outsider)return;if(c.fatherId!==id&&c.motherId!==id)return;if(primaryParent(c)!==id)return;const o=c.fatherId===id?c.motherId:c.fatherId;map.get(partners.includes(o)?o:null).push(c);});
  const out=[]; partners.forEach(p=>{const k=map.get(p);if(k.length)out.push({kids:k});}); if(map.get(null).length)out.push({kids:map.get(null)});
  return out;
}
const countKids=id=>childrenGroups(id).reduce((s,g)=>s+g.kids.length,0);
const rootsList=()=>people.filter(p=>!p.fatherId&&!p.motherId&&!p.outsider&&!(p.gender==='female'&&partnersOf(p.id).length));

function makeCard(p,open,n){
  const c=el('div','card'+(open?' open':''));
  const r=el('div','ring');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';r.appendChild(i);} else r.appendChild(el('div','ph'));
  c.append(r,el('div','n',p.name));
  const life=p.death?'الحياة: '+(p.birth||'؟')+' – '+p.death:(p.birth?'الميلاد: '+p.birth:'');
  if(life)c.appendChild(el('div','meta',life));
  const pts=partnersOf(p.id); if(pts.length)c.appendChild(el('div','sp','الزوج / الزوجة: '+pts.map(nameOf).join('، ')));
  if(n)c.appendChild(el('div','cnt',(open?'طيّ ':'عرض ')+n+' '+(n===1?'ابن/ابنة':'أبناء')));
  return c;
}
function unit(id,isChild){
  const p=byId(id), box=el('div','unit'+(isChild?' child':''));
  const open=expandedSet.has(id);
  const card=makeCard(p,open,countKids(id));
  card.onclick=()=>toggle(id,box,card);
  box.appendChild(card);
  if(open)box.appendChild(kidsEl(id));
  return box;
}
function kidsEl(id){
  const h=el('div','kids');
  childrenGroups(id).forEach(g=>{
    const gr=el('div','group');
    g.kids.forEach((k,i)=>{const u=unit(k.id,true);u.style.animationDelay=(i*120)+'ms';gr.appendChild(u);});
    h.appendChild(gr);
  });
  return h;
}
function toggle(id,box,card){
  const ex=box.querySelector(':scope > .kids'), c=card.querySelector('.cnt');
  if(ex){expandedSet.delete(id);card.classList.remove('open');ex.remove();}
  else{expandedSet.add(id);card.classList.add('open');box.appendChild(kidsEl(id));}
  const n=countKids(id); if(c)c.textContent=(expandedSet.has(id)?'طيّ ':'عرض ')+n+' '+(n===1?'ابن/ابنة':'أبناء');
}
function start(){
  const w=$('tree'); w.innerHTML=''; const r=el('div','roots');
  rootsList().forEach((p,i)=>{const u=unit(p.id,false);u.style.animationDelay=(i*150)+'ms';r.appendChild(u);});
  w.appendChild(r);
}
load();
</script>
</body>
</html>
