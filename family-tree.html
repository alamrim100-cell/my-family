<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة</title>
<style>
:root{--bg:#f7f3ea;--card:#fff;--ink:#2b2b2b;--accent:#8a5a2b;--line:#d9cbb4;--couple:#6b6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
main{padding:20px;max-width:1400px;margin:auto}
#tree{position:relative;overflow-x:auto}
.gen{display:flex;justify-content:center;gap:28px;flex-wrap:nowrap;margin-bottom:64px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;width:190px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative;z-index:1}
.card img,.ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--line);display:block;margin:0 auto 8px}
.card .n{font-weight:bold;font-size:15px;line-height:1.4}
.card .meta{font-size:12px;color:#666;margin-top:4px;line-height:1.5}
.card button{margin-top:6px;padding:3px 10px;font-size:12px}
#lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
#lines path{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
dialog{border:none;border-radius:14px;padding:20px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;margin:10px 0 4px;font-size:14px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.note{background:#fff8e1;border:1px solid #e8d48a;padding:10px;border-radius:8px;margin:10px 0}
.sm{font-size:13px;color:#666}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>شجرة العائلة</h1>
  <div class="bar"><button id="addBtn">+ إضافة شخص</button></div>
</header>

<main>
  <div id="msg" class="note hide"></div>
  <div id="tree"></div>
</main>

<dialog id="formDlg">
  <h3 id="formTitle">إضافة شخص جديد</h3>
  <label>الاسم الكامل *</label><input id="fName">
  <label>تاريخ الميلاد</label><input id="fBirth" type="date">
  <label>الجنس</label>
  <select id="fGender"><option value="">--</option><option value="male">ذكر</option><option value="female">أنثى</option></select>
  <label>الأب</label><select id="fFather"></select>
  <label>الأم</label><select id="fMother"></select>
  <label>الزوج / الزوجة</label><select id="fSpouse"></select>
  <label>الصورة</label><input id="fPhoto" type="file" accept="image/*">
  <label>ملاحظات</label><input id="fBio">
  <div class="bar" style="margin-top:16px">
    <button id="saveBtn">إرسال</button>
    <button class="sec" id="cancelBtn">إلغاء</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== الإعدادات =====
const SUPABASE_URL = 'https://nrddblppxdiklixjxsni.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ألوان ثابتة: كل أسرة (أب + أم) لها لون موحد لخطوطها
const PALETTE = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#0097a7','#f032e6','#7cb342','#9a6324','#c2185b','#1565c0','#ef6c00','#6a1b9a','#2e7d32'];
const svgNS = 'http://www.w3.org/2000/svg';

// ===== الحالة =====
let people = [];
let editingId = null, photoBlob = null;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byId = id => people.find(p => p.id === id);
const nameOf = id => (byId(id) || {}).name || '';
function flash(t){ const m=$('msg'); m.textContent=t; m.classList.remove('hide'); setTimeout(()=>m.classList.add('hide'),6000); }

// ===== تحميل الأشخاص =====
async function loadPeople(){
  const { data, error } = await sb.from('people').select('*').order('created_at');
  if (error){ flash('تعذر تحميل الشجرة، حاول لاحقاً'); return; }
  people = data.map(r => ({
    id: r.id, name: r.name, birth: r.birth || '', gender: r.gender || '',
    fatherId: r.father_id || '', motherId: r.mother_id || '', spouseId: r.spouse_id || '',
    bio: r.bio || '', photo: r.photo_url || ''
  }));
  render();
}

// ===== حساب الأجيال =====
function levels(){
  const lv = {}; people.forEach(p => lv[p.id] = 0);
  for (let i = 0; i < people.length + 1; i++){
    people.forEach(p => {
      [p.fatherId, p.motherId].forEach(pid => {
        if (byId(pid)) lv[p.id] = Math.max(lv[p.id], lv[pid] + 1);
      });
    });
  }
  people.forEach(p => {
    if (p.spouseId && byId(p.spouseId)){
      const m = Math.max(lv[p.id], lv[p.spouseId]); lv[p.id] = lv[p.spouseId] = m;
    }
  });
  return lv;
}

// ===== ترتيب الصفوف: الأبناء بجانب إخوتهم، والزوجان متجاوران =====
function orderedRows(){
  const lv = levels();
  const maxLv = Math.max(0, ...Object.values(lv));
  const rows = [], pos = {};
  for (let k = 0; k <= maxLv; k++){
    let list = people.filter(p => lv[p.id] === k);
    if (k > 0){
      const parentPos = p => (pos[p.fatherId] ?? pos[p.motherId] ?? 1e6);
      list.sort((a, b) => parentPos(a) - parentPos(b) || a.name.localeCompare(b.name, 'ar'));
    }
    const placed = new Set(), out = [];
    list.forEach(p => {
      if (placed.has(p.id)) return;
      out.push(p); placed.add(p.id);
      const s = list.find(x => x.id === p.spouseId && !placed.has(x.id));
      if (s){ out.push(s); placed.add(s.id); }
    });
    out.forEach((p, i) => pos[p.id] = i);
    if (out.length) rows.push(out);
  }
  return rows;
}

// ===== العرض =====
function render(){
  requestAnimationFrame(drawLines);
  const tree = $('tree'); tree.innerHTML = '';
  if (!people.length){ tree.innerHTML = '<p>لا توجد بيانات بعد.</p>'; return; }
  orderedRows().forEach(row => {
    const r = document.createElement('div'); r.className = 'gen';
    row.forEach(p => r.appendChild(card(p)));
    tree.appendChild(r);
  });
}

function card(p){
  const c = document.createElement('div'); c.className = 'card'; c.dataset.id = p.id;
  let ph;
  if (p.photo){ ph = document.createElement('img'); ph.src = p.photo; ph.alt = ''; ph.onload = () => drawLines(); }
  else { ph = document.createElement('div'); ph.className = 'ph'; }
  const n = document.createElement('div'); n.className = 'n'; n.textContent = p.name;
  const m = document.createElement('div'); m.className = 'meta';
  const lines = [];
  if (p.birth) lines.push('الميلاد: ' + p.birth);
  if (p.fatherId) lines.push('الأب: ' + nameOf(p.fatherId));
  if (p.motherId) lines.push('الأم: ' + nameOf(p.motherId));
  if (p.spouseId) lines.push('الزوج / الزوجة: ' + nameOf(p.spouseId));
  if (p.bio) lines.push(p.bio);
  lines.forEach(t => { const d = document.createElement('div'); d.textContent = t; m.appendChild(d); });
  const b = document.createElement('button'); b.className = 'sec'; b.textContent = 'تعديل';
  b.onclick = () => openForm(p.id);
  c.append(ph, n, m, b);
  return c;
}

// ===== خطوط الربط =====
function drawLines(){
  const tree = $('tree'); if (!tree) return;
  let svg = $('lines');
  if (!svg){ svg = document.createElementNS(svgNS, 'svg'); svg.id = 'lines'; tree.prepend(svg); }
  svg.setAttribute('width', tree.scrollWidth);
  svg.setAttribute('height', tree.scrollHeight);
  svg.innerHTML = '';
  const tr = tree.getBoundingClientRect();
  const box = id => {
    const el = id ? tree.querySelector('[data-id="' + id + '"]') : null;
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return {
      cx: r.left - tr.left + tree.scrollLeft + r.width / 2,
      left: r.left - tr.left + tree.scrollLeft, right: r.right - tr.left + tree.scrollLeft,
      top: r.top - tr.top + tree.scrollTop, bottom: r.bottom - tr.top + tree.scrollTop,
      mid: r.top - tr.top + tree.scrollTop + r.height / 2
    };
  };
  const path = (d, color) => {
    const el = document.createElementNS(svgNS, 'path');
    el.setAttribute('d', d); el.setAttribute('stroke', color);
    svg.appendChild(el);
  };

  // خط الزواج (رمادي) بين كل زوجين
  people.forEach(p => {
    const me = box(p.id), s = box(p.spouseId);
    if (me && s && p.id < p.spouseId){
      const [L, R] = me.cx < s.cx ? [me, s] : [s, me];
      path('M' + L.right + ' ' + L.mid + ' H' + R.left, '#6b6b6b');
    }
  });

  // تجميع الأبناء حسب الأسرة (الأب + الأم)
  const families = {};
  people.forEach(p => {
    const ps = [p.fatherId, p.motherId].filter(id => byId(id));
    if (!ps.length) return;
    const key = ps.slice().sort().join('|');
    (families[key] ??= { parents: ps, children: [] }).children.push(p.id);
  });

  Object.values(families).forEach((fam, i) => {
    const color = PALETTE[i % PALETTE.length];
    const pb = fam.parents.map(box).filter(Boolean);
    const kids = fam.children.map(box).filter(Boolean);
    if (!pb.length || !kids.length) return;
    const srcX = pb.reduce((s, x) => s + x.cx, 0) / pb.length;
    const srcBottom = Math.max(...pb.map(x => x.bottom));
    const kidTop = Math.min(...kids.map(x => x.top));
    const midY = srcBottom + (kidTop - srcBottom) / 2;
    const xs = [srcX, ...kids.map(k => k.cx)];
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    let d = 'M' + srcX + ' ' + srcBottom + ' V' + midY;
    if (maxX > minX) d += ' M' + minX + ' ' + midY + ' H' + maxX;
    kids.forEach(k => { d += ' M' + k.cx + ' ' + midY + ' V' + k.top; });
    path(d, color);
  });
}
window.addEventListener('resize', () => drawLines());

// ===== نموذج الإضافة/التعديل =====
function fillSelect(sel, selected, exclude){
  sel.innerHTML = '<option value="">— لا يوجد —</option>';
  people.filter(p => p.id !== exclude).forEach(p => {
    const o = document.createElement('option'); o.value = p.id; o.textContent = p.name;
    if (p.id === selected) o.selected = true;
    sel.appendChild(o);
  });
}

function openForm(id = null){
  editingId = id; photoBlob = null;
  const p = id ? byId(id) : {};
  $('formTitle').textContent = id ? 'تعديل: ' + p.name : 'إضافة شخص جديد';
  $('fName').value = p.name || ''; $('fBirth').value = p.birth || ''; $('fGender').value = p.gender || '';
  fillSelect($('fFather'), p.fatherId, id); fillSelect($('fMother'), p.motherId, id); fillSelect($('fSpouse'), p.spouseId, id);
  $('fBio').value = p.bio || ''; $('fPhoto').value = '';
  $('formDlg').showModal();
}

$('fPhoto').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 300 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => { photoBlob = b; }, 'image/jpeg', 0.82);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
};

$('saveBtn').onclick = async () => {
  if (!$('fName').value.trim()){ alert('الاسم مطلوب'); return; }
  const btn = $('saveBtn'); btn.disabled = true;
  const base = editingId ? byId(editingId) : {};
  let photo_url = base.photo || '';

  if (photoBlob){
    const path = uid() + '.jpg';
    const up = await sb.storage.from('photos').upload(path, photoBlob, { contentType: 'image/jpeg' });
    if (up.error){ alert('تعذر رفع الصورة، حاول مرة أخرى'); btn.disabled = false; return; }
    photo_url = sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
  }

  const data = {
    name: $('fName').value.trim(), birth: $('fBirth').value || null, gender: $('fGender').value || null,
    fatherId: $('fFather').value || null, motherId: $('fMother').value || null, spouseId: $('fSpouse').value || null,
    bio: $('fBio').value.trim(), photo_url
  };
  const { data: status, error } = await sb.rpc('submit_person', { payload: data, target: editingId });
  btn.disabled = false;
  $('formDlg').close();
  if (error){ flash('تعذر إرسال البيانات: ' + error.message); return; }
  if (status === 'approved'){
    flash('تمت الإضافة وظهرت في الشجرة.');
    await loadPeople();
  } else {
    flash('تم إرسال البيانات، وستظهر بعد اعتمادها.');
  }
};

$('addBtn').onclick = () => openForm();
$('cancelBtn').onclick = () => $('formDlg').close();

loadPeople();
</script>
</body>
</html>
