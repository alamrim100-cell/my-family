<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة</title>
<style>
:root{--bg:#f7f3ea;--card:#fff;--ink:#2b2b2b;--accent:#8a5a2b;--line:#d9cbb4}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
main{padding:12px;max-width:100%;overflow:auto}
#tree{position:relative}
/* بطاقة الزوجين: شخصان في بطاقة واحدة */
.unit{position:absolute;display:flex;height:270px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:visible;box-shadow:0 2px 6px rgba(0,0,0,.06);z-index:1}
.panel{width:190px;height:268px;flex:0 0 190px;padding:10px 8px;text-align:center;overflow:hidden}
.panel+.panel{border-right:1px solid var(--line)}
/* الزوج/الزوجة من خارج العائلة: بطاقة أصغر لتتميز عن أفراد العائلة */
.panel.small{width:150px;flex:0 0 150px;padding:8px 6px}
.panel.small img,.panel.small .ph{width:56px;height:56px;margin-bottom:4px}
.panel.small .n{font-size:12px}
.panel.small .meta{font-size:11px}
.panel.small button{font-size:11px;padding:2px 5px}
/* شريك الحياة: شارة صغيرة متداخلة مع أسفل البطاقة */
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;width:168px;height:46px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;background:#fff;border:1px solid var(--accent);border-radius:23px;box-shadow:0 2px 6px rgba(0,0,0,.14);cursor:pointer;z-index:2}
.cph{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);flex:0 0 34px}
.cn{flex:1;font-size:12px;font-weight:bold;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:start}
.panel img,.ph{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--line);display:block;margin:0 auto 6px}
.panel .n{font-weight:bold;font-size:14px;line-height:1.4}
.panel .meta{font-size:12px;color:#666;margin-top:3px;line-height:1.45}
.panel button{margin-top:4px;padding:3px 7px;font-size:12px}
.btns{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px}
#lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
#lines path{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
dialog{border:none;border-radius:14px;padding:20px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;margin:10px 0 4px;font-size:14px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.note{background:#fff8e1;border:1px solid #e8d48a;padding:10px;border-radius:8px;margin:10px 0}
.sm{font-size:13px;color:#666}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>شجرة العائلة</h1>
  <div class="bar"><button id="addBtn">+ إضافة شخص</button></div>
</header>

<main>
  <div id="msg" class="note hide"></div>
  <div id="tree"></div>
</main>

<dialog id="formDlg">
  <h3 id="formTitle">إضافة شخص جديد</h3>
  <label>الاسم الكامل *</label><input id="fName">
  <label>تاريخ الميلاد</label><input id="fBirth" type="date">
  <label>تاريخ الوفاة (إن وُجد)</label><input id="fDeath" type="date">
  <label>الجنس</label>
  <select id="fGender"><option value="">--</option><option value="male">ذكر</option><option value="female">أنثى</option></select>
  <label>الأب</label><select id="fFather"></select>
  <label>الأم</label><select id="fMother"></select>
  <label>الزوج / الزوجة</label><select id="fSpouse"></select>
  <label>الصورة</label><input id="fPhoto" type="file" accept="image/*">
  <label>ملاحظات</label><input id="fBio">
  <div class="bar" style="margin-top:16px">
    <button id="saveBtn">إرسال</button>
    <button class="sec" id="cancelBtn">إلغاء</button>
  </div>
</dialog>

<dialog id="spouseDlg">
  <h3 id="spouseTitle">ربط زوجة</h3>
  <label>اختر من الشجرة</label>
  <select id="spSelect"></select>
  <div class="sm" style="margin-top:8px">إن لم تكن الزوجة في الشجرة، أضفها أولاً من "+ إضافة شخص" ثم اربطها هنا.</div>
  <div class="bar" style="margin-top:16px">
    <button id="spSave">ربط</button>
    <button class="sec" id="spCancel">إلغاء</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== الإعدادات =====
const SUPABASE_URL = 'https://nrddblppxdiklixjxsni.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== ثوابت التخطيط =====
const CW = 190, SW = 150, CH = 270, ROWH = 340, GAPX = 30, PAD = 20;
const PALETTE = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#0097a7','#f032e6','#7cb342','#9a6324','#c2185b','#1565c0','#ef6c00','#6a1b9a','#2e7d32'];
const svgNS = 'http://www.w3.org/2000/svg';

// ===== الحالة =====
let people = [], marriages = [];
let editingId = null, photoBlob = null;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byId = id => people.find(p => p.id === id);
const nameOf = id => (byId(id) || {}).name || '';
function flash(t){ const m=$('msg'); m.textContent=t; m.classList.remove('hide'); setTimeout(()=>m.classList.add('hide'),6000); }

// ===== تحميل البيانات =====
async function loadPeople(){
  const [p, m] = await Promise.all([
    sb.from('people').select('*').order('created_at'),
    sb.from('marriages').select('*')
  ]);
  if (p.error){ flash('تعذر تحميل الشجرة، حاول لاحقاً'); return; }
  people = p.data.map(r => ({
    id: r.id, name: r.name, birth: r.birth || '', death: r.death || '', gender: r.gender || '',
    fatherId: r.father_id || '', motherId: r.mother_id || '', spouseId: r.spouse_id || '',
    bio: r.bio || '', photo: r.photo_url || ''
  }));
  marriages = (m.data || []).map(x => ({ h: x.husband_id, w: x.wife_id, pos: x.position || 0 }));
  render();
}

// ===== الزوج/الزوجة لكل شخص بالترتيب المحدد =====
function partnersOf(id){
  const list = marriages
    .filter(m => m.h === id || m.w === id)
    .sort((a, b) => a.pos - b.pos)
    .map(m => m.h === id ? m.w : m.h);
  const me = byId(id);
  if (me && me.spouseId && byId(me.spouseId) && !list.includes(me.spouseId)) list.push(me.spouseId);
  return [...new Set(list)].filter(x => byId(x));
}

// ===== التخطيط =====
// كل "وحدة" إما زوجان في بطاقة واحدة (couple)، أو شخص وحيد (single)
// والأبناء تحت الوحدة مباشرة
function shiftLayout(l, dx){
  l.items.forEach(i => i.cx += dx);
  l.links.forEach(k => { k.from.cx += dx; k.to.forEach(t => t.cx += dx); });
  l.anchor += dx;
  return l;
}

function colorFor(key){
  let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function layout(id, row, depth = 0){
  if (depth > 15) return { w: CW, anchor: CW / 2, items: [{ type: 'single', a: id, cx: CW / 2, row }], links: [] };
  const partners = partnersOf(id);
  const kb = new Map();
  partners.forEach(p => kb.set(p, []));
  kb.set(null, []);
  people.forEach(c => {
    if (c.fatherId !== id && c.motherId !== id) return;
    const other = c.fatherId === id ? c.motherId : c.fatherId;
    kb.get(partners.includes(other) ? other : null).push(c);
  });
  const groups = partners.map(pid => ({ pid, kids: kb.get(pid) }));
  if (kb.get(null).length || !groups.length) groups.push({ pid: null, kids: kb.get(null) });

  const items = [], links = [];
  let x = 0, anchor = null;
  groups.forEach(g => {
    const unitW = CW;
    const kidRow = row + 1;
    const kl = g.kids.map(k => layout(k.id, kidRow, depth + 1));
    const kidsW = kl.reduce((s, l) => s + l.w, 0) + GAPX * Math.max(0, kl.length - 1);
    const bw = Math.max(unitW, kidsW);
    let kx = x + (bw - kidsW) / 2;
    const kidCenters = [];
    kl.forEach(l => {
      const start = kx;
      shiftLayout(l, start);
      items.push(...l.items); links.push(...l.links);
      kidCenters.push(l.anchor);
      kx = start + l.w + GAPX;
    });
    const bcx = x + bw / 2;
    if (anchor === null) anchor = bcx;
    items.push(g.pid ? { type: 'couple', a: id, b: g.pid, cx: bcx, row } : { type: 'single', a: id, cx: bcx, row });
    if (kl.length) links.push({ color: colorFor(id + '|' + (g.pid || '')), from: { cx: bcx, row }, to: kidCenters.map(c => ({ cx: c, row: kidRow })) });
    x += bw + GAPX;
  });

  const W = Math.max(CW, x - GAPX);
  return { w: W, anchor: anchor === null ? W / 2 : anchor, items, links };
}

function buildTree(){
  const isFemalePartner = p => p.gender === 'female' && partnersOf(p.id).length > 0;
  const roots = people.filter(p => !p.fatherId && !p.motherId && !isFemalePartner(p));
  let x = 0; const items = [], links = [], placed = new Set();
  const addRoot = id => {
    const l = layout(id, 0);
    shiftLayout(l, x + l.w / 2 - l.anchor + l.anchor - l.w / 2 + (l.w / 2 - l.anchor) * 0);
    items.push(...l.items); links.push(...l.links);
    l.items.forEach(i => { placed.add(i.a); if (i.b) placed.add(i.b); });
    x += l.w + GAPX * 3;
  };
  roots.forEach(r => addRoot(r.id));
  people.forEach(p => { if (!placed.has(p.id)) addRoot(p.id); });
  const maxRow = items.reduce((m, i) => Math.max(m, i.row), 0);
  return { items, links, w: Math.max(CW, x - GAPX * 3), h: (maxRow + 1) * ROWH };
}

// ===== العرض =====
function render(){
  const tree = $('tree'); tree.innerHTML = '';
  if (!people.length){ tree.innerHTML = '<p>لا توجد بيانات بعد.</p>'; return; }
  const t = buildTree();
  tree.style.width = (t.w + PAD * 2) + 'px';
  tree.style.height = (t.h + PAD * 2) + 'px';

  const svg = document.createElementNS(svgNS, 'svg');
  svg.id = 'lines';
  svg.setAttribute('width', t.w + PAD * 2);
  svg.setAttribute('height', t.h + PAD * 2);
  tree.appendChild(svg);

  const X = cx => cx + PAD;
  const Y = row => row * ROWH + PAD;
  const path = (d, color) => {
    const el = document.createElementNS(svgNS, 'path');
    el.setAttribute('d', d); el.setAttribute('stroke', color);
    svg.appendChild(el);
  };

  t.links.forEach(l => {
    const fy = Y(l.from.row) + CH, ky = Y(l.to[0].row);
    const midY = (fy + ky) / 2;
    const xs = [X(l.from.cx), ...l.to.map(c => X(c.cx))];
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    let d = `M${X(l.from.cx)} ${fy} V${midY}`;
    if (maxX > minX) d += ` M${minX} ${midY} H${maxX}`;
    l.to.forEach(c => { d += ` M${X(c.cx)} ${midY} V${Y(c.row)}`; });
    path(d, l.color);
  });

  t.items.forEach(it => {
    const a = byId(it.a); if (!a) return;
    const W = CW;
    const unit = document.createElement('div'); unit.className = 'unit';
    unit.style.width = W + 'px';
    unit.style.left = (it.cx - W / 2 + PAD) + 'px';
    unit.style.top = (it.row * ROWH + PAD) + 'px';
    if (it.type === 'couple'){
      const b = byId(it.b);
      if (b){
        const outsider = marriedInId(a, b);
        const main = outsider === a.id ? b : a;
        const spouse = main === a ? b : a;
        unit.append(panel(main, spouse.id, false), chip(spouse));
      }
      else unit.append(panel(a, null));
    } else {
      unit.append(panel(a, null));
    }
    tree.appendChild(unit);
  });
}

// من هو الزوج/الزوجة من خارج العائلة؟ (ليس له أب ولا أم في الشجرة)
function marriedInId(a, b){
  const aHasParents = !!(a.fatherId || a.motherId);
  const bHasParents = !!(b.fatherId || b.motherId);
  if (!aHasParents && bHasParents) return a.id;
  if (aHasParents && !bHasParents) return b.id;
  if (!aHasParents && !bHasParents){
    if (a.gender === 'female') return a.id;
    if (b.gender === 'female') return b.id;
  }
  return null;
}

// شارة شريك الحياة المتداخلة أسفل البطاقة (الضغط عليها يفتح تعديله)
function chip(p){
  const c = document.createElement('div'); c.className = 'chip'; c.title = 'تعديل';
  c.onclick = () => openForm(p.id);
  const img = document.createElement(p.photo ? 'img' : 'div');
  img.className = 'cph';
  if (p.photo) img.src = p.photo;
  const n = document.createElement('div'); n.className = 'cn'; n.textContent = p.name;
  c.append(img, n);
  return c;
}

// بطاقة شخص داخل الوحدة
function panel(p, partnerId, small){
  const c = document.createElement('div'); c.className = 'panel' + (small ? ' small' : '');
  let ph;
  if (p.photo){ ph = document.createElement('img'); ph.src = p.photo; ph.alt = ''; }
  else { ph = document.createElement('div'); ph.className = 'ph'; }
  const n = document.createElement('div'); n.className = 'n'; n.textContent = p.name;
  const m = document.createElement('div'); m.className = 'meta';
  const lines = [];
  if (p.death) lines.push('الحياة: ' + (p.birth || '؟') + ' – ' + p.death);
  else if (p.birth) lines.push('الميلاد: ' + p.birth);
  if (p.fatherId) lines.push('الأب: ' + nameOf(p.fatherId));
  if (p.motherId) lines.push('الأم: ' + nameOf(p.motherId));
  if (p.bio) lines.push(p.bio);
  lines.forEach(t => { const d = document.createElement('div'); d.textContent = t; m.appendChild(d); });

  const edit = document.createElement('button'); edit.className = 'sec'; edit.textContent = 'تعديل';
  edit.onclick = () => openForm(p.id);
  const child = document.createElement('button'); child.className = 'sec'; child.textContent = '+ ابن';
  child.onclick = () => openChildForm(p.id, partnerId);
  const spouse = document.createElement('button'); spouse.className = 'sec'; spouse.textContent = '+ زوجة';
  spouse.onclick = () => openSpouseForm(p.id);
  const btns = document.createElement('div'); btns.className = 'btns';
  btns.append(edit, child, spouse);

  c.append(ph, n, m, btns);
  return c;
}

// ===== نموذج الإضافة/التعديل =====
function fillSelect(sel, selected, exclude){
  sel.innerHTML = '<option value="">— لا يوجد —</option>';
  people.filter(p => p.id !== exclude).forEach(p => {
    const o = document.createElement('option'); o.value = p.id; o.textContent = p.name;
    if (p.id === selected) o.selected = true;
    sel.appendChild(o);
  });
}

function openForm(id = null){
  editingId = id; photoBlob = null;
  const p = id ? byId(id) : {};
  $('formTitle').textContent = id ? 'تعديل: ' + p.name : 'إضافة شخص جديد';
  $('fName').value = p.name || ''; $('fBirth').value = p.birth || ''; $('fGender').value = p.gender || '';
  fillSelect($('fFather'), p.fatherId, id); fillSelect($('fMother'), p.motherId, id); fillSelect($('fSpouse'), p.spouseId, id);
  $('fDeath').value = p.death || '';
  $('fBio').value = p.bio || ''; $('fPhoto').value = '';
  $('formDlg').showModal();
}

// نموذج ابن/ابنة: الأب والأم يُملآن تلقائياً (الزوج المختار أو الأول)
function openChildForm(parentId, partnerId){
  editingId = null; photoBlob = null;
  const par = byId(parentId);
  const partner = partnerId || partnersOf(parentId)[0] || '';
  $('formTitle').textContent = 'إضافة ابن/ابنة لـ ' + par.name;
  $('fName').value = ''; $('fBirth').value = ''; $('fDeath').value = ''; $('fGender').value = '';
  fillSelect($('fFather'), '', null); fillSelect($('fMother'), '', null); fillSelect($('fSpouse'), '', null);
  if (par.gender === 'female'){
    $('fMother').value = parentId; $('fFather').value = partner;
  } else {
    $('fFather').value = parentId; $('fMother').value = partner;
  }
  $('fBio').value = ''; $('fPhoto').value = '';
  $('formDlg').showModal();
}

$('fPhoto').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 300 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => { photoBlob = b; }, 'image/jpeg', 0.82);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
};

$('saveBtn').onclick = async () => {
  if (!$('fName').value.trim()){ alert('الاسم مطلوب'); return; }
  const btn = $('saveBtn'); btn.disabled = true;
  const base = editingId ? byId(editingId) : {};
  let photo_url = base.photo || '';

  if (photoBlob){
    const path = uid() + '.jpg';
    const up = await sb.storage.from('photos').upload(path, photoBlob, { contentType: 'image/jpeg' });
    if (up.error){ alert('تعذر رفع الصورة، حاول مرة أخرى'); btn.disabled = false; return; }
    photo_url = sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
  }

  const data = {
    name: $('fName').value.trim(), birth: $('fBirth').value || null, death: $('fDeath').value || null,
    gender: $('fGender').value || null,
    fatherId: $('fFather').value || null, motherId: $('fMother').value || null, spouseId: $('fSpouse').value || null,
    bio: $('fBio').value.trim(), photo_url
  };
  const { data: status, error } = await sb.rpc('submit_person', { payload: data, target: editingId });
  btn.disabled = false;
  $('formDlg').close();
  if (error){ flash('تعذر إرسال البيانات: ' + error.message); return; }
  if (status === 'approved'){
    flash('تمت الإضافة وظهرت في الشجرة.');
    await loadPeople();
  } else {
    flash('تم إرسال البيانات، وستظهر بعد اعتمادها.');
  }
};

// ===== ربط زوجة/زوج إضافي =====
let spouseHusband = null;
function openSpouseForm(personId){
  spouseHusband = personId;
  const me = byId(personId);
  $('spouseTitle').textContent = 'ربط زوجة لـ ' + me.name;
  const taken = partnersOf(personId);
  const sel = $('spSelect'); sel.innerHTML = '';
  people.filter(p => p.id !== personId && !taken.includes(p.id)).forEach(p => {
    const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o);
  });
  $('spouseDlg').showModal();
}
$('spCancel').onclick = () => $('spouseDlg').close();
$('spSave').onclick = async () => {
  const wife = $('spSelect').value;
  if (!wife){ alert('اختر شخصاً من القائمة'); return; }
  const { data: status, error } = await sb.rpc('link_marriage', { husband: spouseHusband, wife });
  $('spouseDlg').close();
  if (error){ flash('تعذر الربط: ' + error.message); return; }
  if (status === 'approved'){
    flash('تم الربط وظهر في الشجرة.');
    await loadPeople();
  } else {
    flash('تم إرسال طلب الربط، وسيظهر بعد اعتماده.');
  }
};

$('addBtn').onclick = () => openForm();
$('cancelBtn').onclick = () => $('formDlg').close();

loadPeople();
</script>
</body>
</html>
