<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة - التعديل</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Amiri,serif;color:#4a3420;overflow-x:hidden;
  background:radial-gradient(ellipse at center,#fbf4e2 0,#efe2c4 70%,#e2cfa4 100%)}
header{padding:16px 18px 6px;text-align:center}
header h1{margin:0 0 10px;font-size:34px;color:#7a5520;letter-spacing:1px}
.toolbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar button,.toolbar .tlink{font:inherit;font-size:17px;color:#6b4a2b;background:#fffaf0;border:1px solid #b08d4c;border-radius:999px;padding:6px 18px;cursor:pointer;text-decoration:none;transition:all .25s}
.toolbar button:hover:not(:disabled),.toolbar .tlink:hover{background:#f3e2b8}
.toolbar button:disabled{opacity:.4;cursor:default}
.toolbar .primary{background:#6b4a2b;color:#fff;border-color:#6b4a2b}
.toolbar .primary:hover{background:#7a5520}
.crumbs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 0;font-size:16px;color:#8a6b3e}
.crumbs button{font:inherit;font-size:16px;color:#6b4a2b;background:transparent;border:0;cursor:pointer;padding:2px 6px;border-bottom:1px dashed #b08d4c}
.crumbs .sep{color:#b08d4c}
main{padding:24px 14px 100px}
.roots{display:flex;flex-wrap:wrap;justify-content:center;gap:50px;animation:fade .5s both}
.empty{text-align:center;color:#8a6b3e;padding:50px 0;font-size:20px}
.note{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fffaf0;border:1px solid #b08d4c;color:#5a3d1a;padding:10px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(60,35,10,.2);z-index:40;font-size:16px;transition:opacity .4s}
.note.hide{opacity:0;pointer-events:none}

.focus{display:flex;justify-content:center;animation:up .5s both}
.couplehead{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;animation:up .5s both}
.bond{font-size:30px;color:#b08d4c;line-height:1}
.choicesRow{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:34px;padding-top:44px;animation:fade .5s both}
.choicesRow::before{content:'';position:absolute;top:0;left:50%;height:44px;border-left:1px dashed #b08d4c}

/* البطاقة */
.card{position:relative;overflow:hidden;width:225px;padding:18px 12px 12px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,247,230,.7));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;
  border:6px double #b08d4c;border-radius:50% 50% 16px 16px / 22% 22% 16px 16px;
  box-shadow:inset 0 0 0 2px #fffaf0,inset 0 0 0 3px #d9bf85,0 10px 22px rgba(90,60,20,.15);transition:transform .35s}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-5px)}
.card.big{width:270px;padding:22px 16px 14px}
.ring{width:124px;height:124px;margin:0 auto 10px;border-radius:50%;padding:5px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
.card.big .ring{width:156px;height:156px}
.ring img,.ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
.n{font-size:25px;font-weight:700;color:#5a3d1a;line-height:1.3}
.card.big .n{font-size:30px}
.meta{font-size:16px;color:#8a6b3e;margin-top:4px}
.cnt{margin-top:6px;font-size:15px;color:#7a5520;font-style:italic}
.ebtns{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.ebtns button{font:inherit;font-size:13px;color:#6b4a2b;background:#fffaf0;border:1px solid #b08d4c;border-radius:999px;padding:3px 10px;cursor:pointer}
.ebtns button:hover{background:#f3e2b8}
.ebtns button.pri{background:#6b4a2b;color:#fff}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .9s ease}
.card.clickable:hover::after{transform:translateX(120%)}
.card.clickable:hover .n{background:linear-gradient(100deg,#5a3d1a 35%,#d4a94f 50%,#5a3d1a 65%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}

.kidsWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:44px;margin-top:6px;animation:fade .5s both}
.kidsWrap::before{content:'';position:absolute;top:0;left:50%;height:44px;border-left:1px dashed #b08d4c}
.pgroup{display:flex;flex-direction:column;align-items:center;gap:14px}
.glabel span{padding:2px 16px;border:1px solid #b08d4c;border-radius:999px;background:#fffaf0;font-size:17px;color:#7a5520}
.kidsRow{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}

/* نماذج */
dialog{border:none;border-radius:16px;padding:22px;width:min(520px,94vw);background:#fffaf0;color:#3b2a1a;font-family:Cairo,Tahoma,sans-serif;box-shadow:0 20px 50px rgba(60,35,10,.3)}
dialog::backdrop{background:rgba(40,25,10,.45)}
dialog h3{margin:0 0 8px;color:#7a5520}
label{display:block;margin:10px 0 4px;font-size:14px;color:#5a4128}
input,select{width:100%;padding:8px;border:1px solid #d9bf85;border-radius:8px;font:inherit;background:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar button{font:inherit;font-size:15px;color:#fff;background:#6b4a2b;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.bar button.sec{background:#fff;color:#6b4a2b;border:1px solid #6b4a2b}
.bar button:disabled{opacity:.6;cursor:wait}
.sm{font-size:13px;color:#8a6b3e}

/* لوحة التفاصيل */
#drawer{position:fixed;top:0;right:0;height:100%;width:370px;max-width:92vw;overflow:auto;padding:26px 22px;z-index:30;
  background:#fffaf0;border-left:6px double #b08d4c;box-shadow:-12px 0 30px rgba(60,35,10,.2);
  transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#drawer.open{transform:translateX(0)}
#closeDrawer{position:absolute;top:12px;left:12px;font:inherit;font-size:18px;background:transparent;border:1px solid #b08d4c;border-radius:50%;width:36px;height:36px;cursor:pointer;color:#7a5520}
#dbody{text-align:center;padding-top:20px}
#dbody .big{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;padding:6px;background:linear-gradient(135deg,#d9bf85,#8a6b3e,#d9bf85)}
#dbody .big img,#dbody .big .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#eee3c6}
#dbody h2{margin:0 0 12px;font-size:28px;color:#5a3d1a}
#dbody .drow{font-size:19px;line-height:1.7;color:#5a4128;border-bottom:1px dotted #d9bf85;padding:6px 0}
#dbody .bio{font-size:18px;color:#6b5030;margin-top:12px;font-style:italic;line-height:1.8}
#dbody .pl{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dotted #d9bf85;padding:8px 0;font-size:17px}
#dbody .pl button{font:inherit;font-size:13px;color:#8a2b2b;background:#fff;border:1px solid #c98a8a;border-radius:999px;padding:3px 10px;cursor:pointer}
#dbody .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#dbody .actions button{font:inherit;font-size:15px;color:#fff;background:#6b4a2b;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}

/* ===== الهاتف ===== */
@media (max-width:600px){
  header{padding:12px 10px 4px}
  header h1{font-size:24px;margin-bottom:8px}
  .toolbar{gap:6px}
  .toolbar button,.toolbar .tlink{font-size:14px;padding:5px 12px}
  .crumbs{font-size:14px;margin-top:10px;gap:4px}
  main{padding:16px 8px 80px}
  .roots{gap:22px}
  .card{width:175px;padding:12px 8px 10px}
  .card.big{width:235px;padding:16px 10px 12px}
  .ring{width:98px;height:98px;margin-bottom:6px}
  .card.big .ring{width:124px;height:124px}
  .n{font-size:19px}
  .card.big .n{font-size:23px}
  .meta,.cnt{font-size:13px}
  .ebtns button{font-size:12px;padding:2px 7px}
  .kidsRow{gap:14px}
  .kidsWrap{padding-top:34px}
  .kidsWrap::before{height:34px}
  .choicesRow{gap:18px}
  .couplehead{gap:8px}
  .bond{font-size:24px}
  #drawer{width:94vw;padding:20px 16px}
  #dbody h2{font-size:23px}
  #dbody .drow{font-size:17px}
  .empty{font-size:17px}
  .roots,.kidsRow,.couplehead,.choicesRow{flex-wrap:nowrap;overflow-x:auto;justify-content:safe center;width:100%;padding:6px 4px 10px;-webkit-overflow-scrolling:touch}
}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
</style>
</head>
<body>
<header>
  <h1>شجرة العائلة · التعديل</h1>
  <div class="toolbar">
    <button id="backBtn" disabled>→ رجوع</button>
    <button id="homeBtn" disabled>الجيل الأول</button>
    <button id="addBtn" class="primary">+ إضافة شخص</button>
    <a href="family-view.html" class="tlink">واجهة العرض</a>
  </div>
  <div class="crumbs" id="crumbs"></div>
</header>
<main><div id="view"></div></main>
<div id="msg" class="note hide"></div>

<!-- نموذج الشخص -->
<dialog id="formDlg">
  <h3 id="formTitle">إضافة شخص جديد</h3>
  <label>الاسم الكامل *</label><input id="fName">
  <label>تاريخ الميلاد</label><input id="fBirth" type="date">
  <label>تاريخ الوفاة (إن وُجد)</label><input id="fDeath" type="date">
  <label>الجنس</label>
  <select id="fGender"><option value="">--</option><option value="male">ذكر</option><option value="female">أنثى</option></select>
  <label>الأب</label><select id="fFather"></select>
  <label>الأم</label><select id="fMother"></select>
  <label>الزوج / الزوجة</label><select id="fSpouse"></select>
  <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input id="fOutsider" type="checkbox" style="width:auto;margin:0"> من خارج العائلة (زوج/زوجة فقط)</label>
  <label>الصورة</label><input id="fPhoto" type="file" accept="image/*">
  <label>ملاحظات</label><input id="fBio">
  <div class="bar">
    <button id="saveBtn">إرسال</button>
    <button class="sec" id="cancelBtn">إلغاء</button>
  </div>
</dialog>

<!-- زوج/زوجة جديد أو ربط موجود -->
<dialog id="spouseDlg">
  <h3 id="spouseTitle">ربط زوج/زوجة</h3>
  <label>اختر من الشجرة</label>
  <select id="spSelect"></select>
  <div class="sm" style="margin-top:8px">أو أضف زوجاً/زوجة جديداً من خارج العائلة:</div>
  <label>الاسم</label><input id="spName">
  <label>تاريخ الميلاد</label><input id="spBirth" type="date">
  <label>تاريخ الوفاة (إن وُجد)</label><input id="spDeath" type="date">
  <div class="bar">
    <button id="spSave">ربط</button>
    <button class="sec" id="spCancel">إلغاء</button>
  </div>
</dialog>

<aside id="drawer">
  <button id="closeDrawer" title="إغلاق">✕</button>
  <div id="dbody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient('https://nrddblppxdiklixjxsni.supabase.co','sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT');
let people=[], marriages=[];
let stack=[];
let editingId=null, photoBlob=null, spouseHusband=null;
const $=id=>document.getElementById(id);
const byId=id=>people.find(p=>p.id===id);
const nameOf=id=>(byId(id)||{}).name||'';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dispName=p=>(p.death?'المرحوم ':'')+p.name;
const lifeText=p=>p.death?'الحياة: '+(p.birth||'؟')+' – '+p.death:(p.birth?'الميلاد: '+p.birth:'');
function flash(t){ const m=$('msg'); m.textContent=t; m.classList.remove('hide'); clearTimeout(flash.t); flash.t=setTimeout(()=>m.classList.add('hide'),4000); }

// ===== تحميل =====
async function load(){
  const [p,m]=await Promise.all([sb.from('people').select('*').order('created_at'),sb.from('marriages').select('*')]);
  if(p.error){ $('view').innerHTML='<div class="empty">تعذر تحميل الشجرة، حاول لاحقاً</div>'; return; }
  people=(p.data||[]).map(r=>({id:r.id,name:r.name,birth:r.birth||'',death:r.death||'',gender:r.gender||'',fatherId:r.father_id||'',motherId:r.mother_id||'',spouseId:r.spouse_id||'',bio:r.bio||'',photo:r.photo_url||'',outsider:!!r.is_outsider}));
  marriages=(m.data||[]).map(x=>({h:x.husband_id,w:x.wife_id,pos:x.position||0}));
  render();
}

// ===== المنطق =====
function partnersOf(id){
  const list=marriages.filter(m=>m.h===id||m.w===id).sort((a,b)=>a.pos-b.pos).map(m=>m.h===id?m.w:m.h);
  const me=byId(id); if(me&&me.spouseId&&byId(me.spouseId)&&!list.includes(me.spouseId))list.push(me.spouseId);
  people.forEach(p=>{if(p.spouseId===id&&!list.includes(p.id))list.push(p.id);});
  return [...new Set(list)].filter(x=>byId(x));
}
function primaryParent(c){const f=byId(c.fatherId),m=byId(c.motherId);if(f&&!f.outsider)return f.id;if(m&&!m.outsider)return m.id;if(f)return f.id;if(m)return m.id;return null;}
function kidsOfPair(id,pid){
  return people.filter(c=>!c.outsider && ((c.fatherId===id&&c.motherId===pid)||(c.fatherId===pid&&c.motherId===id)) && primaryParent(c)===id);
}
function childrenGroups(id){
  const partners=partnersOf(id), map=new Map(); partners.forEach(p=>map.set(p,[])); map.set(null,[]);
  people.forEach(c=>{if(c.outsider)return;if(c.fatherId!==id&&c.motherId!==id)return;if(primaryParent(c)!==id)return;const o=c.fatherId===id?c.motherId:c.fatherId;map.get(partners.includes(o)?o:null).push(c);});
  const out=[]; partners.forEach(p=>{const k=map.get(p);if(k.length)out.push({label:'مع '+nameOf(p),kids:k});});
  if(map.get(null).length)out.push({label:partners.length?'من غير الزوج/الزوجة المسجّل':'',kids:map.get(null)});
  return out;
}
const countKids=id=>childrenGroups(id).reduce((s,g)=>s+g.kids.length,0);
const rootsList=()=>people.filter(p=>!p.fatherId&&!p.motherId&&!p.outsider&&!(p.gender==='female'&&partnersOf(p.id).length));

// ===== التنقل =====
function open(id){ stack.push({id}); render(); }
function openPair(id,pid){ stack.push({id,pid}); render(); }
function back(){ stack.pop(); render(); }
function jump(i){ stack=stack.slice(0,i+1); render(); }
function home(){ stack=[]; render(); }

// ===== أزرار التعديل على البطاقة =====
function nodeCard(p,o){
  const c=el('div','card'+(o.big?' big':'')+(o.onClick?' clickable':''));
  const r=el('div','ring');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';r.appendChild(i);} else r.appendChild(el('div','ph'));
  c.appendChild(r);
  c.appendChild(el('div','n',dispName(p)));
  const life=lifeText(p); if(life)c.appendChild(el('div','meta',life));
  const n=o.count!==undefined?o.count:countKids(p.id);
  if(n) c.appendChild(el('div','cnt',n+' '+(n===1?'ابن':'أبناء')));

  const eb=el('div','ebtns');
  const bd=el('button','',"التفاصيل"); bd.onclick=ev=>{ev.stopPropagation();openDrawer(p.id);};
  const be=el('button','pri','تعديل'); be.onclick=ev=>{ev.stopPropagation();openForm(p.id);};
  const bk=el('button','','+ ابن'); bk.onclick=ev=>{ev.stopPropagation();openChildForm(p.id,o.partnerId||null);};
  const bs=el('button','','+ زوجة'); bs.onclick=ev=>{ev.stopPropagation();openSpouseForm(p.id);};
  eb.append(bd,be,bk,bs);
  c.appendChild(eb);

  if(o.onClick) c.addEventListener('click',ev=>{ if(!ev.target.closest('.ebtns')) o.onClick(); });
  return c;
}

function kidsSection(kids,parentId,partnerId){
  if(!kids.length) return el('div','empty','لا يوجد أبناء مسجّلون');
  const wrap=el('div','kidsWrap');
  const row=el('div','kidsRow');
  kids.forEach(k=>row.appendChild(nodeCard(k,{onClick:()=>open(k.id)})));
  wrap.appendChild(row);
  return wrap;
}

function render(){
  const cr=$('crumbs'); cr.innerHTML='';
  if(stack.length){
    const h=el('button','','الجيل الأول'); h.onclick=home; cr.appendChild(h);
    stack.forEach((e,i)=>{
      cr.appendChild(el('span','sep','‹'));
      const label=e.pid?nameOf(e.id)+' و'+nameOf(e.pid):nameOf(e.id);
      const b=el('button','',label); b.onclick=()=>jump(i); cr.appendChild(b);
    });
  }
  $('backBtn').disabled=!stack.length;
  $('homeBtn').disabled=!stack.length;

  const v=$('view'); v.innerHTML='';

  if(!stack.length){
    const roots=rootsList();
    if(!roots.length){ v.innerHTML='<div class="empty">لا توجد بيانات بعد. ابدأ بإضافة أول شخص.</div>'; return; }
    const row=el('div','roots');
    roots.forEach(r=>row.appendChild(nodeCard(r,{onClick:()=>open(r.id)})));
    v.appendChild(row);
    return;
  }

  const top=stack[stack.length-1];
  const cur=top.id;
  const partners=partnersOf(cur);

  if(top.pid){
    const cnt=kidsOfPair(cur,top.pid).length;
    const head=el('div','couplehead');
    head.appendChild(nodeCard(byId(cur),{big:true,count:cnt,partnerId:top.pid}));
    head.appendChild(el('div','bond','⚭'));
    head.appendChild(nodeCard(byId(top.pid),{big:true,count:cnt,partnerId:cur}));
    v.appendChild(head);
    v.appendChild(kidsSection(kidsOfPair(cur,top.pid),cur,top.pid));
    return;
  }

  if(partners.length>=2){
    const f=el('div','focus'); f.appendChild(nodeCard(byId(cur),{big:true})); v.appendChild(f);
    const row=el('div','choicesRow');
    partners.forEach(pid=>row.appendChild(nodeCard(byId(pid),{count:kidsOfPair(cur,pid).length,partnerId:cur,onClick:()=>openPair(cur,pid)})));
    v.appendChild(row);
    return;
  }

  const f=el('div','focus'); f.appendChild(nodeCard(byId(cur),{big:true})); v.appendChild(f);
  const groups=childrenGroups(cur);
  if(!groups.length){ v.appendChild(el('div','empty','لا يوجد أبناء مسجّلون لهذا الشخص')); return; }
  const wrap=el('div','kidsWrap');
  groups.forEach(g=>{
    const pg=el('div','pgroup');
    if(groups.length>1&&g.label){ const lb=el('div','glabel'); lb.appendChild(el('span','',g.label)); pg.appendChild(lb); }
    const row=el('div','kidsRow');
    g.kids.forEach(k=>row.appendChild(nodeCard(k,{onClick:()=>open(k.id)})));
    pg.appendChild(row); wrap.appendChild(pg);
  });
  v.appendChild(wrap);
}

// ===== نموذج الشخص =====
function fillSelect(sel,selected,exclude){
  sel.innerHTML='<option value="">— لا يوجد —</option>';
  people.filter(p=>p.id!==exclude).forEach(p=>{
    const o=document.createElement('option'); o.value=p.id; o.textContent=p.name;
    if(p.id===selected) o.selected=true;
    sel.appendChild(o);
  });
}
function openForm(id=null){
  editingId=id; photoBlob=null;
  const p=id?byId(id):{};
  $('formTitle').textContent=id?'تعديل: '+p.name:'إضافة شخص جديد';
  $('fName').value=p.name||''; $('fBirth').value=p.birth||''; $('fDeath').value=p.death||''; $('fGender').value=p.gender||'';
  fillSelect($('fFather'),p.fatherId,id); fillSelect($('fMother'),p.motherId,id); fillSelect($('fSpouse'),p.spouseId,id);
  $('fOutsider').checked=!!p.outsider;
  $('fBio').value=p.bio||''; $('fPhoto').value='';
  $('formDlg').showModal();
}
function openChildForm(parentId,partnerId){
  editingId=null; photoBlob=null;
  const par=byId(parentId);
  const partner=partnerId||partnersOf(parentId)[0]||'';
  $('formTitle').textContent='إضافة ابن/ابنة لـ '+par.name;
  $('fName').value=''; $('fBirth').value=''; $('fDeath').value=''; $('fGender').value=''; $('fOutsider').checked=false; $('fBio').value=''; $('fPhoto').value='';
  fillSelect($('fFather'),'',null); fillSelect($('fMother'),'',null); fillSelect($('fSpouse'),'',null);
  if(par.gender==='female'){ $('fMother').value=parentId; $('fFather').value=partner; }
  else { $('fFather').value=parentId; $('fMother').value=partner; }
  $('formDlg').showModal();
}
$('fPhoto').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,300/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(b=>{photoBlob=b;},'image/jpeg',0.82);
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
};
$('saveBtn').onclick=async()=>{
  if(!$('fName').value.trim()){ alert('الاسم مطلوب'); return; }
  const btn=$('saveBtn'); btn.disabled=true;
  const base=editingId?byId(editingId):{};
  let photo_url=base.photo||'';
  if(photoBlob){
    const path=uid()+'.jpg';
    const up=await sb.storage.from('photos').upload(path,photoBlob,{contentType:'image/jpeg'});
    if(up.error){ alert('تعذر رفع الصورة، حاول مرة أخرى'); btn.disabled=false; return; }
    photo_url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
  }
  const data={
    name:$('fName').value.trim(), birth:$('fBirth').value||null, death:$('fDeath').value||null,
    gender:$('fGender').value||null, outsider:$('fOutsider').checked,
    fatherId:$('fFather').value||null, motherId:$('fMother').value||null, spouseId:$('fSpouse').value||null,
    bio:$('fBio').value.trim(), photo_url
  };
  const {data:status,error}=await sb.rpc('submit_person',{payload:data,target:editingId});
  btn.disabled=false;
  $('formDlg').close();
  if(error){ flash('تعذر إرسال البيانات: '+error.message); return; }
  if(status==='approved'){ flash('تم الحفظ وظهر في الشجرة.'); await load(); }
  else flash('تم إرسال البيانات، وستظهر بعد اعتمادها.');
};
$('addBtn').onclick=()=>openForm();
$('cancelBtn').onclick=()=>$('formDlg').close();

// ===== الزوج/الزوجة =====
function openSpouseForm(personId){
  spouseHusband=personId;
  $('spouseTitle').textContent='ربط زوج/زوجة لـ '+nameOf(personId);
  const taken=partnersOf(personId);
  const sel=$('spSelect'); sel.innerHTML='';
  people.filter(p=>p.id!==personId&&!taken.includes(p.id)).forEach(p=>{
    const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o);
  });
  $('spName').value=''; $('spBirth').value=''; $('spDeath').value='';
  $('spouseDlg').showModal();
}
$('spCancel').onclick=()=>$('spouseDlg').close();
$('spSave').onclick=async()=>{
  const newName=$('spName').value.trim();
  let status,error;
  if(newName){
    const h=byId(spouseHusband);
    const gender=h&&h.gender==='male'?'female':(h&&h.gender==='female'?'male':null);
    const payload={name:newName,birth:$('spBirth').value||null,death:$('spDeath').value||null,gender,outsider:true};
    ({data:status,error}=await sb.rpc('add_spouse_person',{payload,husband:spouseHusband}));
  } else {
    const wife=$('spSelect').value;
    if(!wife){ alert('اختر شخصاً من القائمة أو أدخل اسم الزوج/الزوجة الجديد'); return; }
    ({data:status,error}=await sb.rpc('link_marriage',{husband:spouseHusband,wife}));
  }
  $('spouseDlg').close();
  if(error){ flash('تعذر الربط: '+error.message); return; }
  if(status==='approved'){ flash('تم الربط وظهر في الشجرة.'); await load(); }
  else flash('تم إرسال طلب الربط، وسيظهر بعد اعتماده.');
};

// ===== فك الربط =====
async function unlinkPartner(a,b){
  if(!confirm('فك الربط بين '+nameOf(a)+' و'+nameOf(b)+'؟ الأبناء لن يتأثروا.')) return;
  const {data:status,error}=await sb.rpc('unlink_marriage',{a,b});
  $('drawer').classList.remove('open');
  if(error){ flash('تعذر فك الربط: '+error.message); return; }
  if(status==='approved'){ flash('تم فك الربط.'); await load(); }
  else flash('تم إرسال طلب فك الربط، وينتظر اعتمادك.');
}

// ===== لوحة التفاصيل مع أدوات التعديل =====
function openDrawer(id){
  const p=byId(id); if(!p) return;
  const b=$('dbody'); b.innerHTML='';
  const big=el('div','big');
  if(p.photo){const i=el('img');i.src=p.photo;i.alt='';big.appendChild(i);} else big.appendChild(el('div','ph'));
  b.append(big, el('h2','',dispName(p)));
  const rows=[];
  if(p.gender) rows.push('الجنس: '+(p.gender==='male'?'ذكر':'أنثى'));
  if(p.death) rows.push('فترة الحياة: من '+(p.birth||'؟')+' إلى '+p.death);
  else if(p.birth) rows.push('تاريخ الميلاد: '+p.birth);
  if(p.fatherId) rows.push('الأب: '+nameOf(p.fatherId));
  if(p.motherId) rows.push('الأم: '+nameOf(p.motherId));
  rows.push('عدد الأبناء: '+countKids(id));
  rows.forEach(t=>b.appendChild(el('div','drow',t)));
  if(p.bio) b.appendChild(el('div','bio',p.bio));

  const pts=partnersOf(id);
  if(pts.length){
    b.appendChild(el('div','sm','الزوج / الزوجة'));
    pts.forEach(pid=>{
      const row=el('div','pl');
      row.appendChild(el('span','',nameOf(pid)));
      const u=el('button','','فك الربط'); u.onclick=()=>unlinkPartner(id,pid);
      row.appendChild(u); b.appendChild(row);
    });
  }

  const acts=el('div','actions');
  const be=el('button','','تعديل'); be.onclick=()=>{ $('drawer').classList.remove('open'); openForm(id); };
  const bk=el('button','','+ ابن'); bk.onclick=()=>{ $('drawer').classList.remove('open'); openChildForm(id,null); };
  const bs=el('button','','+ زوجة'); bs.onclick=()=>{ $('drawer').classList.remove('open'); openSpouseForm(id); };
  acts.append(be,bk,bs); b.appendChild(acts);

  $('drawer').classList.add('open');
}
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');

$('backBtn').onclick=back;
$('homeBtn').onclick=home;
load();
</script>
