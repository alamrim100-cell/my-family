<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المالك - شجرة العائلة</title>
<style>
:root{--bg:#f7f3ea;--card:#fff;--ink:#2b2b2b;--accent:#8a5a2b;--line:#d9cbb4;--ok:#2e7d32;--no:#a33}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:20px}
header a{color:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.ok{background:var(--ok)}
button.no{background:var(--no)}
button.small{padding:4px 10px;font-size:13px}
main{max-width:900px;margin:auto;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.box h2{margin:0 0 12px;font-size:18px;color:var(--accent)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:140px;background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.item .t{font-weight:bold}
.sm{font-size:13px;color:#666;margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);margin-inline-start:6px}
#login{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
#login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:8px 0}
.err{color:var(--no);font-size:14px;min-height:20px}
.hide{display:none}
.empty{color:#888}
img.thumb{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-top:6px}
</style>
</head>
<body>

<div id="login" class="hide">
  <h2 style="color:var(--accent);margin-top:0">لوحة المالك</h2>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="pw" type="password" placeholder="كلمة المرور">
  <button id="loginBtn">دخول</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hide">
  <header>
    <h1>لوحة المالك - شجرة العائلة</h1>
    <div class="bar">
      <a href="family-tree.html">عرض الشجرة</a>
      <button class="sec" id="logoutBtn">خروج</button>
    </div>
  </header>
  <main>
    <div class="box">
      <div class="stats">
        <div class="stat"><b id="cntPeople">0</b>أشخاص معتمدون</div>
        <div class="stat"><b id="cntPending">0</b>طلبات بانتظار الاعتماد</div>
      </div>
    </div>

    <div class="box">
      <h2>طلبات الإضافة والتعديل</h2>
      <div class="bar" style="margin-bottom:10px"><button class="sec" id="reloadBtn">تحديث</button></div>
      <div id="pendList"></div>
    </div>

    <div class="box">
      <h2>الأشخاص المعتمدون</h2>
      <div id="peopleList"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== الإعدادات =====
const SUPABASE_URL = 'https://nrddblppxdiklixjxsni.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6tZX-B_42nqRIIe-GIo2xA_oQMVejGT';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let people = [], pending = [];
const $ = id => document.getElementById(id);
const byId = id => people.find(p => p.id === id);
const nameOf = id => (byId(id) || {}).name || '';
const nz = v => (v === '' || v === undefined) ? null : v;

// ===== الدخول =====
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) await enter(); else showLogin();
}

function showLogin(){ $('app').classList.add('hide'); $('login').classList.remove('hide'); }

async function enter(){
  // جدول owners يسمح للمالك فقط برؤية صفه، فإن لم يظهر صف فالحساب ليس مالكاً
  const { data, error } = await sb.from('owners').select('user_id');
  if (error || !data || !data.length){
    await sb.auth.signOut();
    $('loginErr').textContent = 'هذا الحساب ليس مالكاً للوحة';
    showLogin(); return;
  }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  await refresh();
}

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error){ $('loginErr').textContent = 'تعذر الدخول: ' + error.message; return; }
  $('pw').value = '';
  await enter();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); showLogin(); };
$('reloadBtn').onclick = () => refresh();

// ===== تحميل البيانات =====
async function refresh(){
  const [p, s] = await Promise.all([
    sb.from('people').select('*').order('created_at'),
    sb.from('submissions').select('*').eq('status', 'pending').order('created_at')
  ]);
  if (p.error || s.error){ alert('تعذر تحميل البيانات'); return; }
  people = p.data; pending = s.data;
  renderStats(); renderPending(); renderPeople();
}

function renderStats(){
  $('cntPeople').textContent = people.length;
  $('cntPending').textContent = pending.length;
}

function renderPending(){
  const box = $('pendList'); box.innerHTML = '';
  if (!pending.length){ box.innerHTML = '<div class="empty">لا توجد طلبات بانتظار الاعتماد.</div>'; return; }
  pending.forEach(it => {
    const d = it.data || {};
    const wrap = document.createElement('div'); wrap.className = 'item';
    const t = document.createElement('div'); t.className = 't'; t.textContent = d.name || '(بدون اسم)';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = it.type === 'add' ? 'إضافة' : 'تعديل';
    t.appendChild(tag);
    const det = document.createElement('div'); det.className = 'sm';
    det.textContent = [
      it.type === 'edit' && 'الشخص الحالي: ' + nameOf(it.person_id),
      d.birth && 'ميلاد: ' + d.birth,
      d.gender && 'الجنس: ' + (d.gender === 'male' ? 'ذكر' : 'أنثى'),
      d.fatherId && 'الأب: ' + nameOf(d.fatherId),
      d.motherId && 'الأم: ' + nameOf(d.motherId),
      d.spouseId && 'الزوج: ' + nameOf(d.spouseId),
      d.bio && 'ملاحظات: ' + d.bio,
      it.created_at && 'أُرسل: ' + new Date(it.created_at).toLocaleString('ar')
    ].filter(Boolean).join(' | ');
    wrap.append(t, det);
    if (d.photo_url){
      const img = document.createElement('img'); img.className = 'thumb'; img.src = d.photo_url; wrap.appendChild(img);
    }
    const bar = document.createElement('div'); bar.className = 'bar'; bar.style.marginTop = '8px';
    const ok = document.createElement('button'); ok.className = 'ok small'; ok.textContent = 'اعتماد';
    ok.onclick = () => approve(it);
    const no = document.createElement('button'); no.className = 'no small'; no.textContent = 'رفض';
    no.onclick = () => reject(it);
    bar.append(ok, no); wrap.appendChild(bar);
    box.appendChild(wrap);
  });
}

function renderPeople(){
  const box = $('peopleList'); box.innerHTML = '';
  if (!people.length){ box.innerHTML = '<div class="empty">لا يوجد أشخاص بعد.</div>'; return; }
  people.forEach(p => {
    const row = document.createElement('div'); row.className = 'item';
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px';
    const info = document.createElement('div');
    const t = document.createElement('div'); t.className = 't'; t.textContent = p.name;
    const s = document.createElement('div'); s.className = 'sm';
    s.textContent = [p.birth && 'ميلاد: ' + p.birth, p.father_id && 'الأب: ' + nameOf(p.father_id), p.mother_id && 'الأم: ' + nameOf(p.mother_id)].filter(Boolean).join(' | ');
    info.append(t, s);
    const del = document.createElement('button'); del.className = 'no small'; del.textContent = 'حذف';
    del.onclick = () => removePerson(p);
    row.append(info, del); box.appendChild(row);
  });
}

// ===== الإجراءات =====
async function approve(it){
  const d = it.data || {};
  const fields = {
    name: d.name, birth: nz(d.birth), gender: nz(d.gender),
    father_id: nz(d.fatherId), mother_id: nz(d.motherId), spouse_id: nz(d.spouseId),
    bio: nz(d.bio), photo_url: nz(d.photo_url)
  };
  let res;
  if (it.type === 'add'){
    res = await sb.from('people').insert(fields);
  } else {
    res = await sb.from('people').update(fields).eq('id', it.person_id);
  }
  if (res.error){ alert('تعذر الاعتماد: ' + res.error.message); return; }
  await sb.from('submissions').update({ status: 'approved' }).eq('id', it.id);
  refresh();
}

async function reject(it){
  if (!confirm('رفض هذا الطلب؟')) return;
  await sb.from('submissions').update({ status: 'rejected' }).eq('id', it.id);
  refresh();
}

async function removePerson(p){
  if (!confirm('حذف ' + p.name + ' من الشجرة؟ سيُفك ارتباطه بالآخرين.')) return;
  const { error } = await sb.from('people').delete().eq('id', p.id);
  if (error){ alert('تعذر الحذف: ' + error.message); return; }
  refresh();
}

checkSession();
</script>
</body>
</html>
